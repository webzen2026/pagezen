// se už znovu nezobrazí). Žádné nastavování kategorií cookies, jen základní
// upozornění + odkaz na zásady ochrany osobních údajů z patičky (pokud je vyplněný).
// Jednoduchá cookie/GDPR lišta dole na stránce — zobrazí se jen dokud
// návštěvník neklikne na tlačítko (pak se zapamatuje přes localStorage a
// lišta se už znovu nezobrazí, ani na jiné stránce webu). Text i tlačítko
// jsou upravitelné v sekci "Cookie lišta" — pokud web později doplníš o
// vlastní analytiku, uprav si text, ať odpovídá realitě.
function cookieBannerHtml(cookieBanner, footer){
  const cb = cookieBanner || {};
  if (cb.enabled === false) return '';
  const text = (cb.text || '').trim() || T("Tento web pro svůj provoz ukládá jen technicky nutná data v prohlížeči, žádné sledovací cookies.","This site only stores technically necessary data in your browser to operate — no tracking cookies.");
  const buttonText = (cb.buttonText || '').trim() || T("Rozumím","Got it");
  const privacyLink = (footer && footer.links || []).find(l => /ochran|osobn|gdpr|privacy|policy|cookie/i.test(l.label || ''));
  const linkHtml = (privacyLink && (privacyLink.url || '').trim() && privacyLink.url.trim() !== '#')
    ? ` <a href="${escapeAttr(privacyLink.url)}">${escapeHtml(privacyLink.label)}</a>.`
    : '';
  return `<div class="cookie-banner" id="wzCookieBanner" role="dialog" aria-live="polite">
    <p>${escapeHtml(text)}${linkHtml}</p>
    <button type="button" id="wzCookieAccept">${escapeHtml(buttonText)}</button>
  </div>
<script>(function(){
  try { if (localStorage.getItem('wzCookieConsent') === '1') return; } catch(e){}
  var banner = document.getElementById('wzCookieBanner');
  if (!banner) return;
  banner.classList.add('show');
  var btn = document.getElementById('wzCookieAccept');

    try { localStorage.setItem('wzCookieConsent', '1'); } catch(e){}
    banner.classList.remove('show');
  });
})();<\/script>`;
}

// HTML/JS kód, ne zobrazovaný text. Používá hlavní stránka, vlastní podstránky

function toVideoEmbedUrl(url){
  const u = (url || '').trim();
  if (!u) return '';
  let m = u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{6,})/i);
  if (m) return `https://www.youtube-nocookie.com/embed/${m[1]}`;
  m = u.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([a-zA-Z0-9]+))?/i);
  if (m) return `https://player.vimeo.com/video/${m[1]}${m[2] ? '?h='+m[2] : ''}`;
  return u;
}

// Vygeneruje sekci s kontaktním formulářem (nebo prázdný řetězec, pokud je vypnutá).
// Formulář je "statický" (žádný vlastní server) — podle zvolené služby (provider) se

// (otevře e-mailového klienta návštěvníka). Skutečné odesílání řeší contactFormScript().
function buildContactSectionHtml(contact, brand, privacyPage){
  const c = contact || {};
  if (!c.enabled) return '';
  let formAction = '', formExtraAttrs = '', hiddenFields = '';
  if (c.provider === 'formspree'){
    const id = (c.formspreeId || '').trim();

    hiddenFields = `<input type="hidden" name="_subject" value="${escapeAttr(T("Nová zpráva z webu — ","New message from your site — ") + (brand || ''))}">`;
  } else if (c.provider === 'web3forms'){
    const key = (c.web3formsKey || '').trim();
    if (!key) return '';
    formAction = 'https://api.web3forms.com/submit';
    hiddenFields = `<input type="hidden" name="access_key" value="${escapeAttr(key)}"><input type="hidden" name="subject" value="${escapeAttr(T("Nová zpráva z webu — ","New message from your site — ") + (brand || ''))}">`;
  } else if (c.provider === 'netlify'){
    const formName = (c.netlifyFormName || '').trim() || 'contact';
    formExtraAttrs = ` name="${escapeAttr(formName)}" data-netlify="true"`;
    hiddenFields = `<input type="hidden" name="form-name" value="${escapeAttr(formName)}">`;
  } else if (c.provider === 'mailto'){
    const addr = (c.mailtoAddress || '').trim();
    if (!addr) return '';
    formExtraAttrs = ` data-mailto="${escapeAttr(addr)}"`;
  } else {
    return '';
  }
  const phoneField = c.includePhone ? `
${T("        <label>Telefon<input type=\"tel\" name=\"phone\" autocomplete=\"tel\"></label>","        <label>Phone<input type=\"tel\" name=\"phone\" autocomplete=\"tel\"></label>")}` : '';
  // Honeypot proti spamu: pole je pro lidské návštěvníky vizuálně schované
  // (viz .hp-field v CSS), takže ho nevyplní — spamboti ale formuláře
  // procházejí automaticky a běžně vyplní každé pole, které najdou.
  // Pokud přijde vyplněné, contactFormScript() odeslání potichu zahodí.
  const honeypotField = `
${T("        <div class=\"hp-field\" aria-hidden=\"true\"><label>Nechte prázdné<input type=\"text\" name=\"_hpwebsite\" tabindex=\"-1\" autocomplete=\"off\"></label></div>","        <div class=\"hp-field\" aria-hidden=\"true\"><label>Leave blank<input type=\"text\" name=\"_hpwebsite\" tabindex=\"-1\" autocomplete=\"off\"></label></div>")}`;
  // Souhlas se zpracováním osobních údajů — nepovinně zapnutý (výchozí ano),
  // text upravitelný. Pokud je zapnutá stránka GDPR (viz níž), automaticky
  // se na ni přidá odkaz, ať návštěvník ví, s čím přesně souhlasí.
  let consentField = '';
  if (c.gdprConsent !== false){
    const consentText = (c.gdprConsentText || '').trim() || T("Souhlasím se zpracováním výše uvedených osobních údajů za účelem vyřízení mého dotazu.","I agree to the processing of the personal data above in order to handle my inquiry.");
    const privacyLinkHtml = (privacyPage && privacyPage.enabled) ? `${T(" <a href=\"privacy.html\" target=\"_blank\" rel=\"noopener\">Zásady ochrany osobních údajů</a>."," <a href=\"privacy.html\" target=\"_blank\" rel=\"noopener\">Privacy Policy</a>.")}` : '';
    consentField = `
        <label class="contact-consent"><input type="checkbox" name="gdprConsent" required> ${escapeHtml(consentText)}${privacyLinkHtml}</label>`;
  }
  return `
    <section class="contact-section wrap" id="contact">
      ${(c.heading||'').trim() ? `<h2>${escapeHtml(c.heading)}</h2>` : ''}
      ${(c.subtitle||'').trim() ? `<p class="contact-subtitle">${escapeHtml(c.subtitle)}</p>` : ''}
      <form class="contact-form" method="POST"${formAction ? ` action="${escapeAttr(formAction)}"` : ''}${formExtraAttrs} data-contact-provider="${escapeAttr(c.provider)}">
        ${hiddenFields}
${T("        <label>Jméno<input type=\"text\" name=\"name\" autocomplete=\"name\" required></label>","        <label>Name<input type=\"text\" name=\"name\" autocomplete=\"name\" required></label>")}
${T("        <label>E-mail<input type=\"email\" name=\"email\" autocomplete=\"email\" required></label>","        <label>Email<input type=\"email\" name=\"email\" autocomplete=\"email\" required></label>")}${phoneField}
${T("        <label>Zpráva<textarea name=\"message\" rows=\"5\" required></textarea></label>","        <label>Message<textarea name=\"message\" rows=\"5\" required></textarea></label>")}
        ${consentField}
        ${honeypotField}
        <button type="submit">${escapeHtml(c.submitText || T("Odeslat zprávu","Send message"))}</button>
        <p class="contact-status" aria-live="polite"></p>
      </form>
    </section>`;
}

// Obsluha odeslání kontaktního formuláře na exportované stránce — funguje pro
// všechny podporované služby (Formspree, Web3Forms, Netlify Forms, mailto) podle
// atributů data-contact-provider / data-mailto na <form class="contact-form">.
function contactFormScript(){
  return `<script>(function(){
  var form = document.querySelector('.contact-form');
  if (!form) return;
  var statusEl = form.querySelector('.contact-status');
  var provider = form.dataset.contactProvider;
  function setStatus(msg, isError){
    if (!statusEl) return;
    statusEl.textContent = msg;
    statusEl.className = 'contact-status' + (isError ? ' error' : ' success');
  }
  form.addEventListener('submit', function(e){
    e.preventDefault();
    // Honeypot: pokud je vyplněné skryté pole, jde o bota - tvářit se,
    // že zpráva odešla, ale ve skutečnosti nikam neposílat.
    var hp = form.querySelector('input[name="_hpwebsite"]');
    if (hp && hp.value){
      form.reset();
${T("      setStatus('Díky! Zpráva byla odeslána.', false);","      setStatus('Thanks! Your message has been sent.', false);")}
      return;
    }
    if (provider === 'mailto'){
      var fd = new FormData(form);
      var name = fd.get('name') || '';
      var phone = fd.get('phone') || '';
      var message = fd.get('message') || '';
${T("      var body = 'Jméno: ' + name + (phone ? '\\\\nTelefon: ' + phone : '') + '\\\\n\\\\n' + message;","      var body = 'Name: ' + name + (phone ? '\\\\nPhone: ' + phone : '') + '\\\\n\\\\n' + message;")}
      window.location.href = 'mailto:' + encodeURIComponent(form.dataset.mailto || '') +
${T("        '?subject=' + encodeURIComponent('Zpráva z webu') + '&body=' + encodeURIComponent(body);","        '?subject=' + encodeURIComponent('Message from your site') + '&body=' + encodeURIComponent(body);")}
${T("      setStatus('Otevírá se tvoje e-mailová aplikace…', false);","      setStatus('Opening your email app…', false);")}
      return;
    }
    var submitBtn = form.querySelector('button[type=submit]');
    if (submitBtn) submitBtn.disabled = true;
${T("    setStatus('Odesílám…', false);","    setStatus('Sending…', false);")}
    var fetchUrl, fetchOptions;
    if (provider === 'netlify'){
      fetchUrl = window.location.pathname;
      fetchOptions = { method: 'POST', headers: {'Content-Type':'application/x-www-form-urlencoded'}, body: new URLSearchParams(new FormData(form)).toString() };
    } else {
      fetchUrl = form.action;
      fetchOptions = { method: 'POST', body: new FormData(form), headers: {'Accept':'application/json'} };
    }
    fetch(fetchUrl, fetchOptions).then(function(res){
      if (res.ok){
        form.reset();
${T("        setStatus('Díky! Zpráva byla odeslána.', false);","        setStatus('Thanks! Your message has been sent.', false);")}
      } else {
${T("        setStatus('Zprávu se nepodařilo odeslat, zkus to prosím znovu.', true);","        setStatus('Something went wrong sending the message — please try again.', true);")}
      }
    }).catch(function(){
${T("      setStatus('Zprávu se nepodařilo odeslat — zkontroluj připojení k internetu.', true);","      setStatus('Could not send the message — check your internet connection.', true);")}
    }).finally(function(){
      if (submitBtn) submitBtn.disabled = false;
    });
  });
})();<\/script>`;
}

// Sdílený JS pro hamburger menu na mobilu — používá ho hlavní stránka i každá vlastní podstránka.
function menuToggleScript(){
  return `(function () {
      var toggle = document.getElementById('menuToggle');
      var nav = document.getElementById('sideNav');
      var scrim = document.getElementById('navScrim');
      function setOpen(open) {
        if (!toggle || !nav || !scrim) return;
        nav.classList.toggle('open', open);
        scrim.classList.toggle('open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      if (toggle && nav && scrim) {
        toggle.addEventListener('click', function () { setOpen(!nav.classList.contains('open')); });
        scrim.addEventListener('click', function () { setOpen(false); });
      }
      window.__wzCloseMenu = function () { setOpen(false); };
    })();`;
}

// Skript vložený do každé vygenerované stránky (hlavní i vlastní podstránky).
// V reálném nasazení (na hostingu) nic nedělá — odkazy typu "o-nas.html"
// normálně navigují na sousední soubor. V náhledu generátoru ale stránka běží
// v <iframe srcdoc>, takže žádný takový soubor neexistuje a klik by skončil 404.
// Proto tady detekujeme, jestli běžíme uvnitř iframu (window.self !== window.top),
// a pokud ano, klik na odkaz na jinou "stránku webu" (holé jméno souboru, např.
// "o-nas.html" nebo "web.html") přeposíláme postMessage rodiči — ten pak sám
// přegeneruje obsah dané stránky a vloží ho do náhledu, místo skutečné navigace.
function previewNavInterceptScript(){
  return `(function () {
      if (window.self === window.top) return; // mimo náhled (skutečný hosting) se nic neděje
      document.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[href]');
        if (!a) return;
        var href = a.getAttribute('href');
        if (!href) return;
        var m = href.match(/^([a-z0-9-]+\\.html)(#[a-z0-9_-]+)?$/i);
        if (!m) return;
        e.preventDefault();
        window.parent.postMessage({ __webzenPreviewNav: true, filename: m[1], hash: m[2] || '' }, '*');
      });
    })();`;
}

// Sdílený resolver pro cíl odkazu (CTA tlačítka i klikatelné karty na hlavní stránce).
// U cíle "section" teď vede na skutečný, samostatný .html soubor té stránky.
function resolveLinkAttrs(targetType, sectionIndex, url, newTab, fallbackAnchor, customSectionsData){
  if (targetType === 'url') {
    const extra = newTab ? ' target="_blank" rel="noopener"' : '';
    return ` href="${escapeAttr(url || '#')}"${extra}`;
  }
  if (targetType === 'section') {
    const sec = customSectionsData[sectionIndex];
    if (!sec) return ` href="#${fallbackAnchor}" data-scroll-link`;
    return ` href="${escapeAttr(sec.filename)}"`;
  }
  const anchor = targetType === 'faq' ? 'faq' : (targetType === 'hero' ? 'hero' : fallbackAnchor);
  return ` href="#${anchor}" data-scroll-link`;
}

    (function () {
      var localLinks = Array.prototype.slice.call(document.querySelectorAll('[data-scroll-link]'));

      function setActive(link) {
        document.querySelectorAll('.side-nav a').forEach(function (l) { l.classList.remove('active'); });
        if (link) link.classList.add('active');
      }

      // Po kliknutí běží plynulý scroll ke správné sekci a IntersectionObserver
      // by mezitím krátce hlásil i sekce, kterými scroll "prolétá" — proto se na
      // dobu scrollu jeho hlášení ignoruje, aby zvýraznění v menu neposkakovalo.
      var suppressObserver = false;
      var suppressReleaseTimer = null;
      var suppressMaxTimer = null;

      function releaseSuppress() {
        suppressObserver = false;
        clearTimeout(suppressReleaseTimer);
        clearTimeout(suppressMaxTimer);
      }

      function armSuppress() {
        suppressObserver = true;
        clearTimeout(suppressMaxTimer);
        suppressMaxTimer = setTimeout(releaseSuppress, 1000); // pojistka, kdyby scroll event nedoběhl
      }

      window.addEventListener('scroll', function () {
        if (!suppressObserver) return;
        clearTimeout(suppressReleaseTimer);
        suppressReleaseTimer = setTimeout(releaseSuppress, 120);
      }, { passive: true });

      localLinks.forEach(function (a) {
        a.addEventListener('click', function (e) {
          var target = document.querySelector(a.getAttribute('href'));
          if (!target) return;
          e.preventDefault();
          armSuppress();
          target.scrollIntoView({ behavior: 'smooth' });
          setActive(a);
          if (window.__wzCloseMenu) window.__wzCloseMenu();
        });
      });

      if (localLinks.length) setActive(localLinks[0]);

      // Odkazy s nevyplněnou adresou (např. výchozí "#" u odkazů v patičce,
      // dokud jim uživatel nenastaví skutečnou URL) by jinak spustily
      // výchozí chování prohlížeče — okamžitý (neplynulý) skok na úplný
      // začátek stránky, což vypadá, jako by se stránka znovu načetla /
      // "resetla" zpátky na hero. Proto takový klik jednoduše ignorujeme.
      document.addEventListener('click', function (e) {
        var a = e.target.closest && e.target.closest('a[href="#"]');
        if (a) e.preventDefault();
      });

      var homeSections = localLinks
        .map(function (a) { return document.querySelector(a.getAttribute('href')); })
        .filter(Boolean);
      if (homeSections.length && 'IntersectionObserver' in window) {
        var observer = new IntersectionObserver(function (entries) {
          if (suppressObserver) return;
          entries.forEach(function (entry) {
            if (!entry.isIntersecting) return;
            var id = '#' + entry.target.id;
            var match = localLinks.filter(function (a) { return a.getAttribute('href') === id; })[0];
            if (match) setActive(match);
          });
        }, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });
        homeSections.forEach(function (sec) { observer.observe(sec); });
      }
    })();
  <\/script>

const frame = document.getElementById('previewFrame');
let previewTimer = null;
// Když uživatel edituje konkrétní vlastní stránku, náhled se přepne na tuto
// stránku samotnou (bez hero/karet/FAQ hlavní stránky) — previewSectionIndex
// drží index té stránky ve state.sections, nebo null pro náhled hlavní stránky.
let previewSectionIndex = null;

function setPreviewTarget(i){
  previewSectionIndex = i;
  updatePreviewIndicator();
  updatePreview();
}

function updatePreviewIndicator(){
  const el = document.getElementById('previewPageIndicator');
  if (!el) return;
  const isNotFound = previewSectionIndex === 'notfound';
  const isPrivacy = previewSectionIndex === 'privacy';
  const sec = (!isNotFound && !isPrivacy && previewSectionIndex != null) ? state.sections[previewSectionIndex] : null;
  if (sec || isNotFound || isPrivacy) {
    el.classList.add('show');
    const label = isNotFound ? '404 — ' + escapeHtml(state.notFound.heading || T("Stránka nenalezena","Page not found"))
      : isPrivacy ? T("Zásady ochrany osobních údajů","Privacy Policy")
      : escapeHtml(sec.label || sec.title || T("Stránka","Page"));
    el.innerHTML = `${T("📄 Náhled: <b>","📄 Preview: <b>")}${label}</b>`;
    const backBtn = document.createElement('button');
    backBtn.type = 'button';
    backBtn.textContent = T("← Hlavní stránka","← Main page");
    backBtn.onclick = () => setPreviewTarget(null);
    el.appendChild(backBtn);
  } else {
    el.classList.remove('show');
    el.innerHTML = '';
  }
  // Tlačítka v panelu — text se mění podle toho, jestli je daná stránka zrovna
  // v náhledu, jinak by po přepnutí pryč zůstal nesmyslný "Právě v náhledu".
  const nfBtn = document.getElementById('previewNotFoundBtn');
  if (nfBtn) nfBtn.textContent = isNotFound ? T("👁️ Právě v náhledu","👁️ Currently previewing") : T("👁️ Náhled stránky 404","👁️ Preview 404 page");
  const ppBtn = document.getElementById('previewPrivacyBtn');
  if (ppBtn) ppBtn.textContent = isPrivacy ? T("👁️ Právě v náhledu","👁️ Currently previewing") : T("👁️ Náhled stránky","👁️ Preview page");
}

function buildCurrentPreviewHTML(){
  const homeFilename = getHomeFilename(state);
  const customSectionsData = computeCustomSectionsData(state);
  if (previewSectionIndex === 'notfound') {
    return buildNotFoundPageHTML(state, customSectionsData, homeFilename);
  }
  if (previewSectionIndex === 'privacy') {
    return buildPrivacyPageHTML(state, customSectionsData, homeFilename);
  }
  const sec = previewSectionIndex != null ? state.sections[previewSectionIndex] : null;
  if (sec) {
    return buildSectionPageHTML(state, customSectionsData[previewSectionIndex], customSectionsData, homeFilename);
  }
  return buildSiteHTML(state);
}

function updatePreview(){
  clearTimeout(previewTimer);
  previewTimer = setTimeout(() => {
    frame.srcdoc = buildCurrentPreviewHTML();
    autosaveState();
  }, 120);
  scheduleHistorySnapshot();
}

/* ============================================================
   UNDO / REDO
   ============================================================
   Appka drží historii jako pole zaznamenaných stavů (JSON řetězce) +
   ukazatel na aktuální pozici v ní — ne klasický pár undo/redo zásobníků.
   Nový snímek se ukládá s malým zpožděním po poslední změně (ať psaní
   jednoho slova nevytvoří deset kroků zpět), a jen když se stav opravdu
   liší od posledního uloženého. Krok zpět/vpřed jen posouvá ukazatel a
   znovu vykreslí formulář i náhled z toho snímku. */
let history = [];
let historyIndex = -1;
let historyDebounceTimer = null;
let isRestoringHistory = false;
const HISTORY_LIMIT = 60;
const HISTORY_DEBOUNCE_MS = 700;

function initHistory(){
  history = [JSON.stringify(state)];
  historyIndex = 0;
  updateUndoRedoButtons();
}

function captureHistorySnapshot(){
  if (isRestoringHistory) return;
  let snap;
  try { snap = JSON.stringify(state); } catch (err) { return; }
  if (snap === history[historyIndex]) return; // beze změny, nic nového neukládat
  // Nová změna zahazuje případnou "budoucí" (redo) větev historie.
  history = history.slice(0, historyIndex + 1);
  history.push(snap);
  historyIndex = history.length - 1;
  if (history.length > HISTORY_LIMIT) {
    history.shift();
    historyIndex--;
  }
  updateUndoRedoButtons();
}

function scheduleHistorySnapshot(){
  if (isRestoringHistory) return;
  clearTimeout(historyDebounceTimer);
  historyDebounceTimer = setTimeout(captureHistorySnapshot, HISTORY_DEBOUNCE_MS);
}

function restoreHistoryState(){
  isRestoringHistory = true;
  clearTimeout(historyDebounceTimer);
  try {
    state = JSON.parse(history[historyIndex]);
  } catch (err) {
    isRestoringHistory = false;
    return;
  }
  // Náhled konkrétní podstránky/404 se po kroku zpět/vpřed může odkazovat
  // na už neexistující index (např. šla se smazat/přidat stránka) — pro
  // jistotu se vrátit na náhled hlavní stránky.
  previewSectionIndex = null;
  updatePreviewIndicator();
  renderForm();
  updatePreview();
  updateUndoRedoButtons();
  isRestoringHistory = false;
}

function undoAction(){
  if (historyIndex <= 0) return;
  historyIndex--;
  restoreHistoryState();
}

function redoAction(){
  if (historyIndex >= history.length - 1) return;
  historyIndex++;
  restoreHistoryState();
}

function updateUndoRedoButtons(){
  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');
  if (undoBtn) undoBtn.disabled = historyIndex <= 0;
  if (redoBtn) redoBtn.disabled = historyIndex >= history.length - 1;
}

document.getElementById('undoBtn').addEventListener('click', undoAction);
document.getElementById('redoBtn').addEventListener('click', redoAction);
// Klávesové zkratky Ctrl/Cmd+Z (zpět) a Ctrl/Cmd+Shift+Z nebo Ctrl+Y (vpřed) —
// ale jen mimo textová pole, ať appka nebije s vestavěným undo prohlížeče
// uvnitř rozepsaného psaní do pole (tam ať funguje to normální, očekávané).
document.addEventListener('keydown', (e) => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const key = e.key.toLowerCase();
  if (key !== 'z' && key !== 'y') return;
  const active = document.activeElement;
  const isEditable = active && (
    active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' ||
    active.isContentEditable
  );
  if (isEditable) return;
  if (key === 'y' || (key === 'z' && e.shiftKey)) {
    e.preventDefault();
    redoAction();
  } else if (key === 'z') {
    e.preventDefault();
    undoAction();
  }
});

// Zachytává zprávy z náhledového iframu (viz previewNavInterceptScript výš) —
// když uživatel v náhledu klikne na odkaz vedoucí na hlavní nebo vlastní
// stránku webu, místo skutečné (a v náhledu nefunkční) navigace na .html soubor
// sem přijde jen jméno souboru a my podle něj do iframu vložíme vygenerovaný obsah.
let pendingPreviewHash = '';
frame.addEventListener('load', () => {
  if (!pendingPreviewHash) return;
  const hash = pendingPreviewHash;
  pendingPreviewHash = '';
  try {
    const el = frame.contentDocument.querySelector(hash);
    if (el) el.scrollIntoView();
  } catch (err) { /* sandboxed srcdoc — ignore */ }
});

window.addEventListener('message', (e) => {
  if (!e.data || !e.data.__webzenPreviewNav) return;
  const filename = e.data.filename;
  const hash = e.data.hash || '';
  const homeFilename = getHomeFilename(state);
  if (filename === homeFilename) {
    pendingPreviewHash = hash;
    previewSectionIndex = null;
    updatePreviewIndicator();
    frame.srcdoc = buildSiteHTML(state);
    return;
  }
  if (filename === '404.html') {
    pendingPreviewHash = hash;
    previewSectionIndex = 'notfound';
    updatePreviewIndicator();
    frame.srcdoc = buildNotFoundPageHTML(state, computeCustomSectionsData(state), homeFilename);
    return;
  }
  if (filename === 'privacy.html') {
    pendingPreviewHash = hash;
    previewSectionIndex = 'privacy';
    updatePreviewIndicator();
    frame.srcdoc = buildPrivacyPageHTML(state, computeCustomSectionsData(state), homeFilename);
    return;
  }
  const customSectionsData = computeCustomSectionsData(state);
  const idx = customSectionsData.findIndex(cs => cs.filename === filename);
  if (idx !== -1) {
    pendingPreviewHash = hash;
    previewSectionIndex = idx;
    updatePreviewIndicator();
    frame.srcdoc = buildSectionPageHTML(state, customSectionsData[idx], customSectionsData, homeFilename);
  }
});

   ============================================================ */
const STORAGE_KEY = 'layoutGenerator.state.v1';
const autosaveStatusEl = document.getElementById('autosaveStatus');

function formatTime(d){
  return d.toLocaleTimeString('cs-CZ', {hour:'2-digit', minute:'2-digit'});
}

let autosaveTimer = null;
function autosaveState(){
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => {
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ savedAt: new Date().toISOString(), state }));
      if (autosaveStatusEl) autosaveStatusEl.textContent = `${T("Automaticky uloženo ","Auto-saved ")}${formatTime(new Date())}`;
    }catch(err){
      // Např. překročený limit localStorage (velký nahraný obrázek) — na tichém autosave to necháme být,
      // uživatel má pořád k dispozici ruční "Uložit projekt" do souboru.
      if (autosaveStatusEl) autosaveStatusEl.textContent = T("Automatické uložení selhalo (zkus \"Uložit projekt\")","Auto-save failed (try \"Save project\")");
      console.warn(T("Autosave selhal:","Autosave failed:"), err);
    }
  }, 400);
}

function restoreAutosave(){
  let raw;
  try{ raw = localStorage.getItem(STORAGE_KEY); }catch(err){ return; }
  if (!raw) return;
  try{
    const parsed = JSON.parse(raw);
    if (parsed && parsed.state){
      state = Object.assign({}, state, parsed.state);
      const savedAt = parsed.savedAt ? new Date(parsed.savedAt) : null;
      if (autosaveStatusEl){
        autosaveStatusEl.textContent = savedAt
          ? `${T("Obnovena rozpracovaná verze (","Work in progress restored (")}${formatTime(savedAt)})`
          : T("Obnovena rozpracovaná verze","Work in progress restored");
      }
    }
  }catch(err){
    console.warn(T("Nepodařilo se načíst automatické uložení:","Failed to load autosave:"), err);
  }
}

function downloadProjectFile(){
  const payload = JSON.stringify({ savedAt: new Date().toISOString(), state }, null, 2);
  const blob = new Blob([payload], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const slug = (state.brand || T("projekt","project")).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || T("projekt","project");
  a.href = url; a.download = `${slug}.generator.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  if (autosaveStatusEl) autosaveStatusEl.textContent = `${T("Projekt uložen do souboru ","Project saved to file ")}${formatTime(new Date())}`;
}

document.getElementById('saveProjectBtn').addEventListener('click', downloadProjectFile);

document.getElementById('resetProjectBtn').addEventListener('click', () => {
  if (!confirm(T("Opravdu zahodit rozpracovaný obsah a začít znovu se vzorovými texty? Tuto akci nejde vrátit zpět.","Really discard your work in progress and start over with sample text? This action cannot be undone."))) return;
  try{ localStorage.removeItem(STORAGE_KEY); }catch(err){}
  state = getDefaultState();
  previewSectionIndex = null;
  updatePreviewIndicator();
  initHistory();
  renderForm();
  updatePreview();
  if (autosaveStatusEl) autosaveStatusEl.textContent = T("Nový projekt — vzorové texty obnoveny","New project — sample text restored");
});

document.getElementById('loadProjectBtn').addEventListener('click', () => {
  document.getElementById('loadProjectFile').click();
});

document.getElementById('loadProjectFile').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      const loadedState = parsed && parsed.state ? parsed.state : parsed;
      if (!loadedState || typeof loadedState !== 'object') throw new Error(T("Neplatný formát souboru","Invalid file format"));
      state = Object.assign({}, state, loadedState);
      previewSectionIndex = null;
      updatePreviewIndicator();
      initHistory();
      renderForm();
      updatePreview();
      if (autosaveStatusEl) autosaveStatusEl.textContent = `${T("Projekt načten ze souboru ","Project loaded from file ")}${formatTime(new Date())}`;
    }catch(err){
      alert(T("Soubor se nepodařilo načíst — zkontroluj, že jde o .json export z tohoto generátoru.","Failed to load the file — check that it\\'s a .json export from this generator."));
      console.warn(T("Načtení projektu selhalo:","Failed to load project:"), err);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// Dopočítá svislou pozici menu podle skutečné polohy tlačítka "Menu"
// vždy, když ho CSS přišpendlí přes position:fixed (viz breakpoint 1200px
// v CSS — širší než rozvržení pro telefony/tablety, protože tlačítka
// v horní liště se můžou zalomit na druhý řádek už dřív a tlačítko pak
// může skončit kdekoli na tom řádku). Menu tak nikdy nepřeteče mimo
// obrazovku bez ohledu na to, kde tlačítko zrovna je (vodorovně už menu
// drží při zemi CSS pravidla left/right:12px). Nad 1200px se nic nemění —
// tam řídí pozici čistě CSS a tenhle inline styl se rovnou smaže.
function positionDropdownMenu(menu, toggleBtn){
  if (window.innerWidth > 1200) {
    menu.style.top = '';
    return;
  }
  const rect = toggleBtn.getBoundingClientRect();
  menu.style.top = Math.round(rect.bottom + 8) + 'px';
}

(function(){
  // Jedno tlačítko "☰ Menu" v horní liště sdružuje všechny méně časté
  // akce (stahování, EN verze, návod, články, projekt) do jednoho
  // rozbalovacího menu. Undo/Redo a přepínač celé obrazovky zůstávají
  // mimo menu, pořád viditelné vedle sebe.
  const dropdown = document.getElementById('topbarMenu');
  const toggleBtn = document.getElementById('topbarMenuToggle');
  const menuEl = document.getElementById('topbarMenuList');
  function closeMenu(){
    dropdown.classList.remove('open');
    toggleBtn.setAttribute('aria-expanded', 'false');
  }
  toggleBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const willOpen = !dropdown.classList.contains('open');
    if (willOpen) positionDropdownMenu(menuEl, toggleBtn);
    dropdown.classList.toggle('open', willOpen);
    toggleBtn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
  });
  document.addEventListener('click', (e) => {
    if (!dropdown.contains(e.target)) closeMenu();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMenu();
  });
  // Kliknutí na kteroukoli položku v menu (odkaz nebo tlačítko) menu zase zavře.
  dropdown.querySelectorAll('.menu-item').forEach(btn => {
    btn.addEventListener('click', closeMenu);
  });
  dropdown.__closeMenu = closeMenu;
})();

document.getElementById('exportBtn').addEventListener('click', () => {
  downloadTextFile(getHomeFilename(state), buildSiteHTML(state), 'text/html');
  document.getElementById('topbarMenu').__closeMenu();
});

document.getElementById('exportAllBtn').addEventListener('click', () => {
  const homeFilename = getHomeFilename(state);
  downloadTextFile(homeFilename, buildSiteHTML(state), 'text/html');
  const customSectionsData = computeCustomSectionsData(state);
  customSectionsData.forEach((sec, i) => {
    setTimeout(() => {
      downloadTextFile(sec.filename, buildSectionPageHTML(state, sec, customSectionsData, homeFilename), 'text/html');
    }, (i + 1) * 300);
  });
  setTimeout(() => {
    downloadTextFile('404.html', buildNotFoundPageHTML(state, customSectionsData, homeFilename), 'text/html');
  }, (customSectionsData.length + 1) * 300);
  if (state.privacyPage && state.privacyPage.enabled) {
    setTimeout(() => {
      downloadTextFile('privacy.html', buildPrivacyPageHTML(state, customSectionsData, homeFilename), 'text/html');
    }, (customSectionsData.length + 2) * 300);
  }
  // Vygenerované ikony (viz sekce "Ikony webu") — stáhnou se jen pokud už
  // byly v editoru vytvořené (uživatel nahrál obrázek a použil výřez).
  let iconJobSlot = customSectionsData.length + (state.privacyPage && state.privacyPage.enabled ? 3 : 2);
  if (state.icons.appleTouchIcon) { const slot = iconJobSlot++; setTimeout(() => downloadDataUrl('apple-touch-icon.png', state.icons.appleTouchIcon), slot * 300); }
  if (state.icons.icon192) { const slot = iconJobSlot++; setTimeout(() => downloadDataUrl((state.pwa.icon192 || 'icon-192.png').trim(), state.icons.icon192), slot * 300); }
  if (state.icons.icon512) { const slot = iconJobSlot++; setTimeout(() => downloadDataUrl((state.pwa.icon512 || 'icon-512.png').trim(), state.icons.icon512), slot * 300); }
  if (state.icons.ogImage) { const slot = iconJobSlot++; setTimeout(() => downloadDataUrl('og-image.png', state.icons.ogImage), slot * 300); }
  document.getElementById('topbarMenu').__closeMenu();
});

document.querySelectorAll('.mobile-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.mobile-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const ws = document.getElementById('workspace');
    ws.classList.toggle('show-editor', tab.dataset.tab === 'editor');
    ws.classList.toggle('show-preview', tab.dataset.tab === 'preview');
    if (tab.dataset.tab === 'preview') window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});

document.querySelectorAll('.view-btn[data-view]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-btn[data-view]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('frameHolder').classList.toggle('mobile', btn.dataset.view === 'mobile');
  });
});

/* ---------- náhled hotového webu přes celou plochu (bez panelu úprav) ---------- */
(function(){
  const btn = document.getElementById('fullPagePreviewBtn');
  const ws = document.getElementById('workspace');
  if (!btn || !ws) return;
  function setPreviewOnly(active){
    ws.classList.toggle('preview-only', active);
    btn.classList.toggle('active', active);
    btn.textContent = active ? T("✕ Zpět na úpravu","✕ Back to editing") : T("⛶ Celá stránka","⛶ Full page");
  }
  btn.addEventListener('click', () => setPreviewOnly(!ws.classList.contains('preview-only')));
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && ws.classList.contains('preview-only')) setPreviewOnly(false);
  });
})();

/* ---------- no-branding unlock (bez odkazu na SYNTHLUCIDA PageZen v patičce) ----------
   Odemykací kód není v kódu uložený čitelně, jen jeho SHA-256 otisk (hash) -
   zadaný kód se při kontrole taky zahashuje a porovnají se jen ty dva otisky,
   takže kód není vidět ani v konzoli, ani ve zdrojovém kódu appky. */
(function(){
  const WZ_NOBRAND_HASH = 'bf37c9a5fc39f2273248d50933da5a6de091b2afac26440a0e3aa25444148161';
  const LS_KEY = 'wz_nobrand_unlocked';
  const input = document.getElementById('wzUnlockInput');
  const btn = document.getElementById('wzUnlockSubmit');
  const msg = document.getElementById('wzUnlockMsg');
  if (!input || !btn || !msg) return;
  input.placeholder = T('Odemykací kód','Unlock code');

  async function sha256Hex(text){
    const enc = new TextEncoder().encode(text);
    const digest = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function setUnlockedUi(){
    const bar = document.getElementById('wzDonateBar');
    if (bar) bar.style.display = 'none';
  }

  let already = false;
  try { already = localStorage.getItem(LS_KEY) === '1'; } catch(e){}
  if (already) setUnlockedUi();

  async function tryUnlock(){
    const val = input.value.trim();
    if (!val) return;
    let hash;
    try {
      hash = await sha256Hex(val);
    } catch(err){
      alert(T('Kód se nepodařilo ověřit (potřeba https nebo localhost).','Could not verify the code (requires https or localhost).'));
      return;
    }
    if (hash === WZ_NOBRAND_HASH){
      try { localStorage.setItem(LS_KEY, '1'); } catch(e){}
      setUnlockedUi();
      if (typeof updatePreview === 'function') updatePreview();
      alert(T('Kód přijat — vygenerovaný web bude bez odkazu na SYNTHLUCIDA PageZen.','Code accepted — your generated website will have no SYNTHLUCIDA PageZen link.'));
    } else {
      alert(T('Zadaný kód je neplatný.','The code you entered is invalid.'));
    }
  }

  btn.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });
})();

restoreAutosave();
initHistory();
renderForm();
updatePreview();

// Registrace service workera appky samotné (ne generovaných webů) — díky
// tomu appku jde nainstalovat jako PWA a funguje i offline. Soubor sw.js
// (viz sw.js vedle tohoto souboru).
//
// Auto-update: sw.js sám při instalaci volá skipWaiting() a při aktivaci
// clients.claim() (viz sw.js), takže jakmile prohlížeč zjistí novější sw.js
// (jiný obsah souboru), nová verze rovnou převezme kontrolu nad už otevřenou
// stránkou. Událost "controllerchange" níže na to zareaguje jedním reloadem,
// ať appka běží vždy na nejnovější verzi bez ručního obnovování stránky.
// Rozpracovaná práce se přitom neztratí — appka ji průběžně ukládá do
// localStorage (viz restoreAutosave()) a po reloadu ji sama obnoví.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      // Appka může zůstat otevřená dlouho (běží offline/jako balíček), takže
      // se nespoléhá jen na vestavěnou kontrolu prohlížeče při navigaci —
      // občas se sw.js zkontroluje i ručně.
      reg.update().catch(() => {});
      setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
    }).catch((err) => {
      console.log(T("[SW] Registrace appky selhala:","[SW] App registration failed:"), err);
    });
  });

  let wzSwRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (wzSwRefreshing) return;
    wzSwRefreshing = true;
    location.reload();
  });
}
</script>
