<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PageZen — Website builder</title>
<link rel="icon" href="./icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#7c5cff">
<meta name="description" content="PageZen — build a website quickly, no coding.">
<script>
/* Runs before the app script below; picks the interface language before
   anything renders, so the very first paint (title, <html lang>) is already
   correct. The main app script re-derives the same value into LANG/T. */
(function(){
  var lang = 'en';
  try {
    var saved = localStorage.getItem('pagezen_lang');
    if (saved === 'cs' || saved === 'en') lang = saved;
    else {
      var nav = ((navigator.language || navigator.userLanguage || 'en') + '').toLowerCase();
      lang = (nav.indexOf('cs') === 0 || nav.indexOf('sk') === 0) ? 'cs' : 'en';
    }
  } catch(e){}
  document.documentElement.lang = lang;
  document.title = lang === 'cs' ? 'PageZen — Tvorba webu rychle, bez kódování' : 'PageZen — Build a website quickly, no coding';
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ui-bg-0:#0b0c10;
    --ui-bg-1:#14161c;
    --ui-bg-2:#1b1e26;
    --ui-line:#272b35;
    --ui-text:#e8e9ee;
    --ui-text-dim:#8b8f9c;
    --ui-accent:#7c5cff;
    --ui-accent-glow:#4c1d95;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--ui-bg-0);color:var(--ui-text);
    font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .app{display:flex;flex-direction:column;height:100vh;}

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;align-items:center;gap:16px;padding:12px 20px;
    background:var(--ui-bg-1);border-bottom:1px solid var(--ui-line);flex:0 0 auto;
    flex-wrap:wrap;row-gap:8px;
  }
  .topbar-brand{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;
    display:flex;align-items:center;min-width:0;flex:0 1 auto;
  }
  .topbar-brand-name{flex:0 0 auto;white-space:nowrap;}
  .topbar-brand-tagline{
    font-weight:500;color:var(--ui-text-dim);font-size:12.5px;
    min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .topbar-sub{color:var(--ui-text-dim);font-size:12.5px;display:none;flex:0 0 auto;}
  @media(min-width:760px){.topbar-sub{display:block;}}
  #fullscreenBtn.active{color:#fff;border-color:var(--ui-accent);background:rgba(124,92,255,.15);}

  /* ---------- donate/unlock bar (odemykací kód přes Gumroad) ---------- */
  .donate-bar{
    flex:0 0 auto;text-align:center;padding:7px 20px;font-size:12px;
    color:var(--ui-text-dim);background:var(--ui-bg-2);border-bottom:1px solid var(--ui-line);
  }
  .donate-bar a{color:var(--ui-accent);text-decoration:none;font-weight:600;}
  .donate-bar a:hover{text-decoration:underline;}
  .wz-unlock-inline{display:inline-flex;align-items:center;gap:6px;margin-left:8px;vertical-align:middle;}
  .wz-unlock-inline input{
    background:var(--ui-bg-1);border:1px solid var(--ui-line);color:var(--ui-text);
    border-radius:6px;padding:4px 8px;font-size:12px;width:150px;font-family:'JetBrains Mono',monospace;
  }
  .wz-unlock-inline input:focus{outline:none;border-color:var(--ui-accent);}
  .wz-unlock-inline button{
    background:transparent;border:1px solid var(--ui-accent);color:var(--ui-accent);
    border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .wz-unlock-inline button:hover{background:rgba(124,92,255,.15);}
  .wz-unlock-msg{margin-left:8px;font-weight:600;}
  .wz-unlock-msg.ok{color:#4caf82;}
  .wz-unlock-msg.err{color:#e0615a;}
  /* Focus/fullscreen režim schová i tuto lištu, ať zbyde víc místa na editor. */
  body.focus-mode .donate-bar{display:none;}

  /* Návod a Články se od teď zobrazují v modálním okně (viz .info-modal-*),
     aby nezabíraly trvalé místo nahoře nad workspace. */
  .about-content{
    padding:16px 20px 18px;color:var(--ui-text-dim);font-size:13px;line-height:1.6;
  }
  .about-content h4{
    color:var(--ui-text);font-size:13px;margin:14px 0 4px;
    font-family:'Space Grotesk',sans-serif;
  }
  .about-content p{margin:0 0 4px;}

  .articles-section-content{padding:16px 20px 18px;}
  .tip-line{background:rgba(124,92,255,.08);border-left:3px solid var(--ui-accent);padding:8px 12px;border-radius:6px;margin:0 0 10px;}
  .footer-note-manual{margin-top:20px;text-align:center;font-size:11px;color:var(--ui-text-dim);opacity:.6;}
  .info-modal-body{flex:1;overflow-y:auto;}
  .article{
    background:var(--ui-bg-2);border:1px solid var(--ui-line);border-radius:var(--radius);
    margin-bottom:10px;max-width:760px;
  }
  .article summary{
    cursor:pointer;padding:11px 14px;font-size:13px;font-weight:600;
    color:var(--ui-text);list-style:none;user-select:none;
  }
  .article summary::-webkit-details-marker{display:none;}
  .article summary::before{content:'▸ ';color:var(--ui-accent);}
  .article[open] summary::before{content:'▾ ';}
  .article-content{
    padding:0 14px 16px;color:var(--ui-text-dim);font-size:13px;line-height:1.65;
  }
  .article-content h3{
    color:var(--ui-text);font-size:13px;margin:14px 0 4px;
    font-family:'Space Grotesk',sans-serif;
  }
  .article-content p{margin:0 0 8px;}
  .article-content ul{margin:0 0 8px;padding-left:18px;}
  .article-content li{margin:0 0 4px;}
  .topbar-spacer{flex:1;}
  /* Jedno tlačítko "Menu" v horní liště, které v sobě sdružuje všechny
     méně časté / vedlejší akce (stahování, EN verze, návod, články,
     projekt) — ať lišta zůstane přehledná. Undo/Redo a přepínač celé
     obrazovky zůstávají mimo menu, pořád viditelné vedle sebe. */
  .topbar-menu{position:relative;}
  .topbar-menu-list{
    display:none;position:absolute;top:calc(100% + 8px);right:0;z-index:50;
    min-width:260px;max-height:min(70vh,560px);overflow-y:auto;
    background:var(--ui-bg-2);border:1px solid var(--ui-line);
    border-radius:10px;padding:6px;box-shadow:0 12px 32px -8px rgba(0,0,0,.5);
    flex-direction:column;gap:2px;
  }
  .topbar-menu.open .topbar-menu-list{display:flex;}
  .menu-item{
    display:block;width:100%;text-align:left;background:transparent;border:none;
    color:var(--ui-text);padding:9px 10px;border-radius:7px;cursor:pointer;
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;text-decoration:none;
    box-sizing:border-box;
  }
  .menu-item:hover{background:rgba(124,92,255,.15);}
  .menu-item-title{display:block;font-size:13px;font-weight:600;}
  .menu-item-desc{display:block;font-size:11.5px;color:var(--ui-text-dim);margin-top:2px;line-height:1.4;font-weight:400;}
  .menu-divider{height:1px;background:var(--ui-line);margin:5px 4px;}
  .menu-section-title{
    padding:8px 10px 2px;font-size:11px;font-weight:600;text-transform:uppercase;
    letter-spacing:.03em;color:var(--ui-text-dim);
  }
  .save-btn{
    background:transparent;color:var(--ui-text);border:1px solid var(--ui-line);padding:8px 14px;
    border-radius:8px;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    cursor:pointer;transition:border-color .15s,color .15s;white-space:nowrap;
  }
  .save-btn:hover{border-color:var(--ui-accent);color:var(--ui-accent);}
  .save-btn:disabled{opacity:.35;cursor:default;}
  .save-btn:disabled:hover{border-color:var(--ui-line);color:var(--ui-text);}
  .home-btn{text-decoration:none;display:inline-flex;align-items:center;gap:5px;}
  .autosave-status{font-size:11.5px;color:var(--ui-text-dim);white-space:nowrap;}

  /* ---------- workspace ---------- */
  .workspace{flex:1;display:flex;min-height:0;}
  .app-footer{
    flex:0 0 auto;text-align:center;padding:8px 20px;font-size:11.5px;
    color:var(--ui-text-dim);background:var(--ui-bg-1);border-top:1px solid var(--ui-line);
  }
  .app-footer a{color:var(--ui-text-dim);text-decoration:none;}
  .app-footer a:hover{color:var(--ui-accent);text-decoration:underline;}
  .footer-link-btn{background:none;border:none;padding:0;margin:0;font:inherit;color:var(--ui-text-dim);cursor:pointer;text-decoration:none;}
  .footer-link-btn:hover{color:var(--ui-accent);text-decoration:underline;}
  .panel{
    width:360px;flex:0 0 360px;overflow-y:auto;background:var(--ui-bg-0);
    border-right:1px solid var(--ui-line);padding:16px;
    counter-reset:field-section;
  }
  .preview-wrap{flex:1;display:flex;flex-direction:column;min-width:0;background:#08090c;}
  .preview-toolbar{
    display:flex;align-items:center;gap:8px;padding:10px 16px;
    border-bottom:1px solid var(--ui-line);flex:0 0 auto;
  }
  .preview-toolbar .label{font-size:12px;color:var(--ui-text-dim);margin-right:4px;}
  .view-btn{
    background:transparent;border:1px solid var(--ui-line);color:var(--ui-text-dim);
    padding:5px 12px;border-radius:6px;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .view-btn.active{color:#fff;border-color:var(--ui-accent);background:rgba(124,92,255,.12);}
  .preview-page-indicator{
    display:none;align-items:center;gap:8px;margin-left:auto;font-size:12.5px;
    color:var(--ui-text-dim);background:rgba(124,92,255,.1);border:1px solid var(--ui-line);
    padding:5px 6px 5px 10px;border-radius:7px;
  }
  .preview-page-indicator.show{display:flex;}
  .preview-page-indicator b{color:var(--ui-text);font-weight:600;}
  .preview-page-indicator button{
    background:var(--ui-accent);color:#fff;border:none;padding:4px 10px;border-radius:5px;
    font-size:11.5px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;
  }
  .preview-frame-holder{flex:1;display:flex;align-items:flex-start;justify-content:center;
    padding:22px;overflow:auto;}
  #previewFrame{
    background:#fff;border:0;width:100%;height:100%;border-radius:12px;
    box-shadow:0 0 0 1px var(--ui-line), 0 20px 60px -20px rgba(0,0,0,.7);
    transition:width .25s ease;
  }
  .preview-frame-holder.mobile #previewFrame{width:390px;max-width:100%;height:100%;}

  /* ---------- náhled hotového webu přes celou plochu (bez panelu úprav) ---------- */
  .workspace.preview-only .panel{display:none;}
  .workspace.preview-only .preview-frame-holder{padding:0;}
  .workspace.preview-only #previewFrame{border-radius:0;box-shadow:none;}

  /* ---------- mobile editor/preview switch (hidden on desktop) ---------- */
  .mobile-tabs{
    display:none;gap:8px;padding:8px 12px;background:var(--ui-bg-1);
    border-bottom:1px solid var(--ui-line);flex:0 0 auto;
  }
  .mobile-tab{
    flex:1;background:transparent;border:1px solid var(--ui-line);color:var(--ui-text-dim);
    padding:9px 10px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .mobile-tab.active{color:#fff;border-color:var(--ui-accent);background:rgba(124,92,255,.15);}

  /* Horní lišta se může zalomit na druhý řádek prakticky při jakékoli šířce,
     jakmile se do ní tlačítka nevejdou (viz vždy zapnutý flex-wrap výš
     u .topbar) — to začíná už dost nad breakpointem 860px níž, přičemž
     tlačítko "Menu" pak může skončit kdekoli na tom zalomeném řádku. Tahle
     pojistka (menu přišpendlené na celou šířku s pozicí dopočítanou v JS,
     viz positionDropdownMenu) proto potřebuje širší práh než zbytek
     rozvržení pro telefony/tablety — jinak by vznikla mezera, kdy je
     tlačítko už zalomené, ale menu pořád používá pozicování napravo jako
     na desktopu a může vyjet mimo obrazovku. */
  @media(max-width:1200px){
    .topbar-menu-list{
      position:fixed;left:12px;right:12px;min-width:0;width:auto;
    }
  }
  /* ---------- responsive layout for editing on phones / narrow tablets ---------- */
  @media(max-width:860px){
    .mobile-tabs{display:flex;}
    .topbar{flex-wrap:wrap;row-gap:8px;padding:10px 12px;gap:6px;}
    .topbar-brand{font-size:14px;flex:1 1 auto;}
    .topbar-brand-tagline{display:none;}
    .topbar-sub{display:none !important;}
    .autosave-status{
      font-size:11px;max-width:92px;overflow:hidden;text-overflow:ellipsis;
      white-space:nowrap;flex:0 1 auto;
    }
    .workspace{flex-direction:column;overflow:visible;}
    .panel{
      width:100%;flex:1 1 auto;border-right:none;border-bottom:1px solid var(--ui-line);
      max-height:none;
    }
    .preview-wrap{flex:1 1 auto;min-height:60vh;}
    .workspace.show-editor .preview-wrap{display:none;}
    .workspace.show-preview .panel{display:none;}
    .preview-frame-holder{padding:12px;}
  }
  @media(max-width:480px){
    .topbar .btn-label{display:none;}
    .save-btn{padding:8px 10px;}
    .panel{padding:14px;}
    .row2{grid-template-columns:1fr;}
  }

  /* ---------- form ---------- */
  .fieldset{
    counter-increment:field-section;
    margin-bottom:14px;
    background:var(--ui-bg-1);
    border:1px solid var(--ui-line);
    border-radius:var(--radius);
    padding:14px 14px 16px;
  }
  .fieldset-title{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12.5px;
    letter-spacing:.05em;text-transform:uppercase;color:var(--ui-accent);
    margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--ui-line);
    display:flex;align-items:center;gap:8px;
  }
  .fieldset-title::before{
    content:counter(field-section,decimal-leading-zero);
    flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;border-radius:6px;background:rgba(124,92,255,.15);
    color:var(--ui-accent);font-family:'JetBrains Mono',monospace;font-size:10.5px;
    letter-spacing:0;
  }
  /* ---------- rozevírací (accordion) sekce levého panelu ---------- */
  .fieldset-title.fieldset-toggle{cursor:pointer;}
  .fieldset-title.fieldset-toggle:hover{color:#fff;}
  .fieldset-title.fieldset-toggle::after{
    content:'▾';margin-left:auto;flex:0 0 auto;font-size:10px;
    color:var(--ui-text-dim);transition:transform .2s ease;
  }
  .fieldset.collapsed{padding-bottom:6px;}
  .fieldset.collapsed .fieldset-title.fieldset-toggle::after{transform:rotate(-90deg);}
  .fieldset-body-wrap{display:grid;grid-template-rows:1fr;transition:grid-template-rows .22s ease;}
  .fieldset.collapsed .fieldset-body-wrap{grid-template-rows:0fr;}
  .fieldset-body{overflow:hidden;min-height:0;}
  label{display:block;font-size:12px;color:var(--ui-text-dim);margin:10px 0 4px;}
  label:first-child{margin-top:0;}
  input[type=text],textarea,select{
    width:100%;background:var(--ui-bg-2);border:1px solid var(--ui-line);color:var(--ui-text);
    padding:8px 10px;border-radius:7px;font-family:'Inter',sans-serif;font-size:13px;
    resize:vertical;
  }
  input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--ui-accent);}
  textarea{min-height:52px;line-height:1.4;padding-right:30px;}
  textarea.code-input{
    font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.5;min-height:90px;
    font-variant-ligatures:none;-webkit-font-feature-settings:"liga" 0,"calt" 0;font-feature-settings:"liga" 0,"calt" 0;
  }
  .textarea-wrap{position:relative;}
  /* Skutečné WYSIWYG pole (contenteditable) — zobrazuje rovnou naformátovaný text
     (tučně/kurzíva/…), řídicí znaky (**, __, ++, ~~, [ ](...)) se v něm vůbec
     nezobrazují a nezabírají místo; existují jen v datech (viz ceToRaw/richText). */
  .rt-ce{
    width:100%;min-height:52px;line-height:1.4;padding:8px 30px 8px 10px;
    background:var(--ui-bg-2);border:1px solid var(--ui-line);border-radius:7px;
    font-family:'Inter',sans-serif;font-size:13px;color:var(--ui-text);
    white-space:pre-wrap;word-wrap:break-word;overflow-wrap:break-word;cursor:text;
  }
  .rt-ce:focus{outline:none;border-color:var(--ui-accent);}
  .rt-ce:empty::before{content:attr(data-placeholder);color:var(--ui-text-dim);}
  .rt-ce a{color:var(--ui-accent);text-decoration:underline;cursor:text;}
  .textarea-expand-btn{
    position:absolute;top:6px;right:6px;width:22px;height:22px;padding:0;z-index:2;
    background:var(--ui-bg-1);border:1px solid var(--ui-line);border-radius:5px;
    color:var(--ui-text-dim);font-size:12px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .textarea-expand-btn:hover{border-color:var(--ui-accent);color:var(--ui-accent);}
  .fmt-toolbar{display:flex;gap:4px;margin:8px 0 6px;flex-wrap:wrap;}
  .fmt-btn{
    background:var(--ui-bg-2);border:1px solid var(--ui-line);color:var(--ui-text);
    width:26px;height:24px;border-radius:5px;font-size:12.5px;cursor:pointer;
    font-family:'Inter',sans-serif;display:flex;align-items:center;justify-content:center;padding:0;
  }
  .fmt-btn:hover{border-color:var(--ui-accent);color:var(--ui-accent);}
  .fmt-btn.active{border-color:var(--ui-accent);background:var(--ui-accent);color:#fff;}
  .fmt-btn.b{font-weight:700;}
  .fmt-btn.i{font-style:italic;}
  .fmt-btn.u{text-decoration:underline;}
  .fmt-btn.big{font-size:15px;font-weight:700;}
  .fmt-btn.small{font-size:10px;font-weight:700;}
  .expand-modal .fmt-toolbar{margin:0;padding:10px 14px 0;}
  .expand-modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(4,5,8,.72);z-index:1000;
    align-items:center;justify-content:center;padding:24px;
  }
  .expand-modal-overlay.open{display:flex;}
  .expand-modal{
    width:100%;max-width:680px;height:min(72vh,640px);display:flex;flex-direction:column;
    background:var(--ui-bg-1);border:1px solid var(--ui-line);border-radius:12px;
    box-shadow:0 24px 80px -20px rgba(0,0,0,.8);overflow:hidden;
  }
  .expand-modal-header{
    flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;border-bottom:1px solid var(--ui-line);
    font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13.5px;color:var(--ui-text);
  }
  .expand-modal-header button{
    background:transparent;border:1px solid var(--ui-line);color:var(--ui-text-dim);
    padding:6px 12px;border-radius:7px;font-size:12.5px;cursor:pointer;font-family:'Inter',sans-serif;
  }
  .expand-modal-header button:hover{border-color:var(--ui-accent);color:var(--ui-accent);}
  .expand-modal .textarea-wrap{flex:1;min-height:0;position:relative;}
  .expand-modal .textarea-wrap textarea{width:100%;height:100%;}
  .expand-modal textarea{
    resize:none;border:none;border-radius:0;
    background:var(--ui-bg-0);color:var(--ui-text);padding:16px;font-family:'Inter',sans-serif;
    font-size:14.5px;line-height:1.6;
  }
  .expand-modal textarea:focus{outline:none;}
  .expand-modal textarea.code-input{
    font-family:'JetBrains Mono',monospace;font-size:13.5px;
    font-variant-ligatures:none;-webkit-font-feature-settings:"liga" 0,"calt" 0;font-feature-settings:"liga" 0,"calt" 0;
  }
  .expand-modal .rt-ce{
    width:100%;height:100%;border:none;border-radius:0;background:var(--ui-bg-0);
    padding:16px;font-size:14.5px;line-height:1.6;overflow-y:auto;
  }
  .expand-modal .rt-ce:focus{border:none;}
  .expand-modal-hint{
    flex:0 0 auto;padding:8px 14px;font-size:11.5px;color:var(--ui-text-dim);
    border-top:1px solid var(--ui-line);
  }

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .swatches{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 4px;}
  .swatch{
    width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;
    transition:transform .12s,border-color .12s;
  }
  .swatch:hover{transform:scale(1.15);}
  .swatch.active{border-color:#fff;}
  .style-preset-picker{

<script>
/* ============================================================
   JAZYK APPKY (CZ/EN) — LANG se určí jednou při načtení stránky
   (uloženo v localStorage, jinak podle jazyka prohlížeče);
   přepnutí jazyka je řešené jako uložení volby + reload stránky,
   takže veškerý text v appce (i vygenerovaný náhled) je vždy
   ve správném jazyce bez nutnosti cokoli přepisovat za běhu.
   ============================================================ */
const LANG = (function(){
  try {
    const saved = localStorage.getItem('pagezen_lang');
    if (saved === 'cs' || saved === 'en') return saved;
  } catch(e){}
  const nav = ((navigator.language || navigator.userLanguage || 'en') + '').toLowerCase();
  return (nav.indexOf('cs') === 0 || nav.indexOf('sk') === 0) ? 'cs' : 'en';
})();
function T(cs, en){ return LANG === 'cs' ? cs : en; }
function setLang(lang){
  try { localStorage.setItem('pagezen_lang', lang); } catch(e){}
  location.reload();
}


/* ---------- static content: Guide / Manual / Articles / Privacy (both languages) ---------- */
const GUIDE_HTML_CS = `
          <p>PageZen je jednoduchý generátor webů — od jednostránkové prezentace až po web s více podstránkami. Vlevo vyplňuješ formulář, vpravo hned vidíš živý náhled; jednotlivé sekce formuláře jde rozbalovat a sbalovat kliknutím na jejich nadpis, ať máš i u delšího webu přehled. Nic se neprogramuje — na konci si stáhneš hotový, funkční HTML soubor (nebo víc souborů, pokud máš i vlastní podstránky), který stačí nahrát na hosting. Hodí se na osobní web, prezentaci produktu, službu nebo landing page.</p>

          <h4>Jak začít</h4>
          <p>Nahoře vyplň Název webu, Doménu (použije se v odkazech pro vyhledávače a sociální sítě) a Titulek + Popis stránky pro SEO. V sekci Ikony webu nahraj jeden obrázek (logo nebo ikonku) — appka z něj sama vygeneruje favicon, apple-touch-icon i obě PWA ikony, stačí doladit výřez posuvníky a kliknout na „Použít výřez a vygenerovat ikony". Pak nastav Hero sekci — hlavní nadpis a podnadpis, které návštěvník uvidí jako první.</p>

          <h4>CTA tlačítka a vizuál</h4>
          <p>Pod hero textem můžeš přidat jedno nebo víc tlačítek — každé může vést na sekci webu, na vlastní URL, nebo do FAQ. U každého jde nastavit, jestli je hlavní (výrazné) nebo doplňkové, a jestli se otevírá v nové záložce. Do hero sekce lze volitelně vložit i obrázek — buď nahráním ze zařízení, nebo vložením URL — a je dobré k němu doplnit alternativní text (pomáhá SEO i přístupnosti).</p>

          <h4>Video a audio</h4>
          <p>Nepovinná sekce „Video / Audio" přidá na hlavní stránku (za Karty/funkce) přehrávatelné video a/nebo zvukovou nahrávku. U videa vybereš buď odkaz na YouTube/Vimeo (automaticky se převede na vložené video), nebo vlastní soubor/URL (.mp4, .webm). Audio se stejně tak nahraje jako soubor nebo se vloží URL (.mp3, .wav). K oběma jde přidat nepovinný popisek nad přehrávačem.</p>

          <h4>Vzhled — grafický styl, barvy, písmo a rozvržení</h4>
          <p>Grafický styl (barvy + písmo dohromady) nastavíš nejrychleji přes hotové předvolby v sekci „Grafický styl webu" a pak si výsledek ještě doladíš ručně v sekcích Barvy (accent, glow a dvě barvy pozadí) a Písmo (zvlášť pro nadpisy a pro běžný text). V sekci „Rozvržení webu" pak volíš samotné uspořádání, ne barvy — pro hero sekci vystředěné, dvousloupcové (obrázek vlevo/vpravo), zarovnané vlevo, obrázek na pozadí nebo orámovaný box (text i obrázek v kartě se stínem uprostřed); pro karty/funkce mřížku, seznam, číslované kroky nebo minimalistický styl bez rámečků.</p>

          <h4>Navigace</h4>
          <p>V sekci Navigace zapneš/vypneš a přejmenuješ odkazy na Hero, Funkce a FAQ v levém menu webu. Volba „Zobrazovat vlastní stránky v menu" určuje, jestli se vlastní stránky (viz níže) automaticky přidávají do menu na každé stránce webu, nebo jestli je propojíš jen ručně přes tlačítka a karty. Dole ve stejné sekci můžeš přidat ikony sociálních sítí (Instagram, Facebook, TikTok, YouTube, e-mail…) — zobrazí se jako spodní řádek levého menu na každé stránce.</p>

          <h4>Vlastní stránky</h4>
          <p>V sekci „Vlastní stránky" přidáváš další podstránky webu — každá se exportuje jako svůj vlastní samostatný .html soubor (název podle textu v menu, např. <code>o-nas.html</code>) s vlastní URL, <code>&lt;title&gt;</code>, meta description i canonical/OG tagy, takže je to lepší pro SEO i sdílení odkazů než schované sekce v jednom souboru. U každé stránky vybereš typ: <strong>Prostá</strong> (nadpis + text, volitelně obrázek — jako dřív) nebo <strong>Landing</strong> (vlastní hero, podnadpis, volitelné tlačítko a karty funkcí). Pokud je zapnuté zobrazování v menu, objeví se stránka automaticky jako položka v levém menu na každé stránce webu; jinak na ni musíš odkázat ručně — CTA tlačítka i klikatelné karty umí mířit i na konkrétní vlastní stránku. Sitemap.xml pak automaticky obsahuje URL všech vlastních stránek.</p>

          <h4>Karty, FAQ, kontaktní formulář a patička</h4>
          <p>V sekci Karty / funkce popíšeš jednotlivé výhody nebo služby (ikona, nadpis, text). V sekci FAQ přidáš časté otázky a odpovědi — automaticky se z nich vygeneruje i strukturovaná data pro Google. Volitelná sekce „Kontaktní formulář" přidá na hlavní stránku (za FAQ) formulář s volbou, kam se má odesílat — Formspree, Web3Forms, Netlify Forms (funguje jen při hostování na Netlify), nebo prosté „mailto" bez cizí služby; jde přidat i volitelné pole Telefon a povinný souhlas se zpracováním osobních údajů s vlastním textem. V Patičce nastavíš, jestli se má zobrazit „© rok značka", volitelný vlastní text (např. IČO, adresa) a odkazy (obchodní podmínky, kontakt apod.).</p>

          <h4>PWA, sitemapa a robots.txt</h4>

<p class="tip-line"><strong>Tip: </strong><strong>Tip:</strong> use questions people actually ask (email, phone, social media), not invented ones. The answer should come in the first sentence, with detail after it.</p>

  </div>
</details>

<details class="article">
  <summary>12. Contact form</summary>
  <div class="article-content">

<p>The optional "Contact form" section adds a form to the homepage (after the FAQ), with a choice of where it sends to:</p>
<ul>
<li><strong>Formspree</strong> or <strong>Web3Forms</strong> — external services, need their own key/account.</li>
<li><strong>Netlify Forms</strong> — only works when hosted on Netlify.</li>
<li><strong>mailto</strong> — a plain email send, no third-party service.</li>
</ul>
<p>You can also add an optional Phone field and a required consent checkbox with your own text. The form includes basic spam protection (a honeypot field invisible to human visitors).</p>

  </div>
</details>

<details class="article">
  <summary>13. Footer</summary>
  <div class="article-content">

<p>In the Footer section you decide whether to show "© year brand", an optional custom text (e.g. company registration number, address), and links (terms, contact, privacy policy, etc.).</p>

  </div>
</details>

<details class="article">
  <summary>14. PWA, sitemap.xml and robots.txt</summary>
  <div class="article-content">

<p>In the advanced options, the app can generate:</p>
<ul>
<li><strong>manifest.json</strong> and <strong>sw.js</strong> — these let visitors "install" the site as an app (PWA) to their phone or computer's home screen, with some content working offline.</li>
<li><strong>sitemap.xml</strong> and <strong>robots.txt</strong> — for search engines.</li>
</ul>
<p>These files are downloaded separately with their own buttons and, after export, uploaded alongside the main HTML file. The generated <code>sw.js</code> automatically accounts for the main page under both its actual downloaded filename and <code>index.html</code>, so the offline cache works no matter how you rename the main page on your host.</p>
<p class="tip-line"><strong>Tip: </strong><strong>Icon images</strong> (favicon, apple-touch-icon, 192×192, 512×512, og-image) are generated in the "Website icons" section (see step 2) — just upload one image and adjust the crop, and the app prepares every size and filename for you. They then download automatically together with the rest of the site via "Download entire site".</p>

  </div>
</details>

<details class="article">
  <summary>15. 404 page</summary>
  <div class="article-content">

<p>The "404 page" section generates a standalone <code>404.html</code> file, which most hosts (Netlify, GitHub Pages, Vercel…) automatically show instead of the browser's own error message for a missing address. It's downloaded separately and deliberately kept out of search-engine indexing (meta robots "noindex").</p>

  </div>
</details>

<details class="article">
  <summary>16. Cookie bar and GDPR page</summary>
  <div class="article-content">

<p>The "Cookie bar" shows a one-time notice at the bottom of the page — it's remembered in the visitor's browser and won't show again afterward. If your Footer has a link whose label contains "privacy", "gdpr", "personal", or similar, the bar links to it automatically.</p>
<p>In "GDPR / Privacy Policy" you can generate a <code>privacy.html</code> page whose text adapts to whether (and which) service your contact form uses. It's a general template, not legal advice — depending on your site, you may need to adapt it or have a lawyer review it.</p>

  </div>
</details>

<details class="article">
  <summary>17. Custom code (advanced)</summary>
  <div class="article-content">

<p>The "Custom code" section lets you add your own CSS, code for <code>&lt;head&gt;</code> (e.g. verification codes, custom fonts), and code before <code>&lt;/body&gt;</code> (e.g. a chat widget or tracking script). It's inserted on the homepage, every custom page, and the 404 page, so you only fill it in once.</p>
<p class="tip-line"><strong>Tip: </strong><strong>Careful:</strong> whatever you put here goes straight into the site exactly as written, with no validation — a mistake in the code can break the page.</p>

  </div>
</details>

<details class="article">
  <summary>18. Preview and working on mobile</summary>
  <div class="article-content">

<p>On the right side of the app you switch the preview between Desktop and Mobile, so you can see how the site will look on a phone. If you're editing the app directly from a mobile device, a top switch for "Edit content / Site preview" appears for easier work on a small screen.</p>

  </div>
</details>

<details class="article">
  <summary>19. Saving your work</summary>
  <div class="article-content">

<p>The app continuously autosaves your in-progress project to your <strong>browser's localStorage</strong> (locally, not on a server) — closing the tab won't lose anything. In addition:</p>
<ul>
<li><strong>💾 Save project</strong> — downloads a .json file with your entire in-progress site.</li>
<li><strong>📂 Load project</strong> — reopens a saved .json, for example on a different computer.</li>
<li><strong>🗑️ New project</strong> — resets the app back to the sample content.</li>
</ul>

  </div>
</details>

<details class="article">
  <summary>20. Export and uploading to hosting</summary>
  <div class="article-content">

<p>The "↓ Download" button in the top right expands a menu:</p>
<ul>
<li><strong>Download HTML</strong> — just the homepage, as a single .html file.</li>
<li><strong>Download entire site</strong> — the homepage and all custom pages at once, each as its own file.</li>
</ul>
<p>Upload all the downloaded files together to any static-site host (e.g. GitHub Pages, Netlify, or a regular web host). You can keep the homepage under its downloaded name, or rename it to <code>index.html</code> if you want the site to load at the bare domain with no filename in the address — the PWA offline cache works automatically either way. If you're also using PWA, sitemap/robots.txt, the 404 page, or the GDPR page, download their files separately from their own sections and upload them alongside the rest.</p>

  </div>
</details>

<details class="article">
  <summary>21. SEO tips</summary>
  <div class="article-content">

<h3>Title and meta description</h3>
<p>The page title should include the site name plus a keyword that describes the offer (e.g. "Downtown Hair Salon — book online"). The meta description acts like a short ad in search results — aim for around 150–160 characters.</p>
<h3>Real subpages instead of hidden anchors</h3>
<p>If a site covers several topics, it's better for SEO to have them as separate custom pages with their own address, title, and description, rather than hiding them as anchors on one long page.</p>
<h3>Images</h3>
<p>Use JPEG or WebP for photos, and PNG or SVG for logos and icons with transparency. Resize an image to its actual display size before uploading — unnecessarily large files just slow the site down. Always add alt text.</p>
<h3>Mobile first</h3>
<p>Most visitors arrive via mobile — check the site on a small screen first, not only after finishing it on a computer.</p>

  </div>
</details>

<details class="article">
  <summary>22. Troubleshooting</summary>
  <div class="article-content">

<ul><li><strong>The preview is blank / unresponsive</strong> — Try refreshing the app's page (autosave means your data won't be lost) and, if needed, open the app in an up-to-date browser (Chrome, Firefox, Safari, Edge).</li><li><strong>An uploaded image/video made the export huge</strong> — Uploaded files are embedded directly into the HTML as base64. For large files (especially video), use a URL to external hosting instead.</li><li><strong>The site doesn't work after uploading to hosting</strong> — Check that you uploaded every downloaded file (HTML, manifest.json, sw.js, any custom pages) into the same folder, and that image paths match where you actually saved them.</li><li><strong>The cookie bar doesn't link to the privacy policy</strong> — Check that the Footer link's label contains the word "privacy", "gdpr", or similar — otherwise the app can't match them up automatically.</li><li><strong>I lost my in-progress project</strong> — The app stores it in the browser's localStorage — unless you cleared your browser's site data, it should restore itself the next time you open the app. Use "Save project" regularly as a backup too.</li></ul>



  </div>
</details>

function escapeHtml(s){

// Umožní v textových polích psát odkazy zápisem [text odkazu](https://adresa.cz)
// a jednoduché formátování — **tučně**, *kurzíva*, __podtržení__, ++větší text++, ~~menší text~~
// (dá se psát ručně, nebo použít tlačítka nad polem) — a bezpečně je převede na
// skutečné HTML tagy (zbytek textu zůstává escapovaný jako obyčejný text).
// Značky (**, __, ++, ~~) nesmí být nalepené hned na písmeno/číslici — jinak by se
// běžný text jako "C++" nebo "Firma++" omylem spároval s další "++" dál v textu
// a smazal/rozbil vše mezi nimi. NB/NA hlídají, že před otevírací a za zavírací
// značkou není písmeno ani číslice (skutečné formátování má kolem sebe mezeru/interpunkci).
// Sdílený zdroj regexu pro rozpoznání formátovacích značek — použit jak pro
// tokenizaci celého řetězce (tokenizeRichText), tak pro "živé" rozpoznání
// právě dokončené značky při psaní (richTextMatchRegex). Alternativa pro
// "***" (tučně+kurzíva zároveň) musí být PŘED alternativou pro "**" — jinak
// by se u tří hvězdiček za sebou (typicky vzniklých kombinací tučně+kurzíva)
// spároval jen první pár a třetí hvězdička by zůstala osamocená a viditelná
// v náhledu jako obyčejný znak.
function richMarkupSource(){
  const NB = '(?<![\\p{L}\\p{N}])', NA = '(?![\\p{L}\\p{N}])';
  // Přísnější varianta hranice jen pro osamocenou "*" (kurzíva): navíc hlídá,
  // že hvězdička na okraji značky není sama součástí sousední "**"/"***"
  // sekvence (jinak by se z dvojice/trojice omylem "ukously" jedna hvězdička
  // pro kurzívu a zbytek by se rozpadl). U __, ++, ~~ to řešit netřeba —
  // žádný znak nesdílí s jiným typem značky.
  const NBs = '(?<![\\p{L}\\p{N}*])', NAs = '(?![\\p{L}\\p{N}*])';
  return '\\[([^\\]\\n]+)\\]\\((https?:\\/\\/[^\\s)]+|\\/[^\\s)]*|#[^\\s)]*|mailto:[^\\s)]+)\\)' +
    `|${NB}\\*\\*\\*([^\\n]+?)\\*\\*\\*${NA}` +
    `|${NB}\\*\\*([^\\n]+?)\\*\\*${NA}` +
    `|${NB}__([^\\n]+?)__${NA}` +
    `|${NB}\\+\\+([^\\n]+?)\\+\\+${NA}` +
    `|${NB}~~([^\\n]+?)~~${NA}` +
    `|${NBs}\\*(?!\\*)([^\\n]+?)(?<!\\*)\\*${NAs}`;
}
function tokenizeRichText(str){
  const s = String(str ?? '');
  const re = new RegExp(richMarkupSource(), 'gu');
  const tokens = [];
  let last = 0, m;
  while ((m = re.exec(s))){
    if (m.index > last) tokens.push({type:'text', raw:s.slice(last, m.index)});
    if (m[1] !== undefined) tokens.push({type:'link', label:m[1], url:m[2]});
    else if (m[3] !== undefined) tokens.push({type:'boldital', inner:m[3]});
    else if (m[4] !== undefined) tokens.push({type:'bold', inner:m[4]});
    else if (m[5] !== undefined) tokens.push({type:'underline', inner:m[5]});
    else if (m[6] !== undefined) tokens.push({type:'big', inner:m[6]});
    else if (m[7] !== undefined) tokens.push({type:'small', inner:m[7]});
    else if (m[8] !== undefined) tokens.push({type:'italic', inner:m[8]});
    last = re.lastIndex;
  }
  if (last < s.length) tokens.push({type:'text', raw:s.slice(last)});
  return tokens;
}

// Finální výstup (na webu) — značky zmizí, zůstane jen skutečné HTML formátování.
function richText(str){
  return tokenizeRichText(str).map(t => {
    if (t.type === 'text') return escapeHtml(t.raw);
    if (t.type === 'link') {
      const label = escapeHtml(t.label);
      const url = escapeAttr(t.url);
      const external = /^https?:\/\//.test(t.url);
      return `<a href="${url}"${external ? ' target="_blank" rel="noopener"' : ''}>${label}</a>`;
    }
    // Vnitřek se rekurzivně projde přes richText() znovu (ne jen escapeHtml) —
    // díky tomu funguje i vzájemné kombinování formátů (např. tučně + kurzíva),
    // protože případné další značky uvnitř (**, __, ++, ~~, *) se rozpoznají
    // a promění se ve skutečné vnořené HTML tagy, místo aby zůstaly jako
    // syrové znaky viditelné v náhledu.
    if (t.type === 'boldital') return `<strong><em>${richText(t.inner)}</em></strong>`;
    if (t.type === 'bold') return `<strong>${richText(t.inner)}</strong>`;
    if (t.type === 'underline') return `<u>${richText(t.inner)}</u>`;
    if (t.type === 'big') return `<span style="font-size:1.18em;">${richText(t.inner)}</span>`;
    if (t.type === 'small') return `<span style="font-size:0.85em;">${richText(t.inner)}</span>`;
    if (t.type === 'italic') return `<em>${richText(t.inner)}</em>`;
    return '';
  }).join('');
}

/* ============================================================
   WYSIWYG editace formátovaného textu (contenteditable)
   ------------------------------------------------------------
   Pole se teď needituje jako "surový" text se značkami (**text**…),
   ale jako skutečně naformátovaný obsah (<strong>, <em>, …) —
   řídicí znaky vůbec nejsou v editoru vidět a nezabírají místo.
   Vznikají výhradně při serializaci zpět do datového řetězce
   (ceToRaw), který je pak i nadále zdrojem pravdy ve `state`
   a vstupem pro finální export přes richText().
   ============================================================ */

// Vytvoří skutečný formátovací element (bez viditelných řídicích znaků).
function buildRichTag(type, innerText){
  if (type === 'boldital'){
    const strong = document.createElement('strong');
    const em = document.createElement('em');
    em.innerHTML = richText(innerText);
    strong.appendChild(em);
    return strong;
  }
  let el;
  if (type === 'bold') el = document.createElement('strong');
  else if (type === 'underline') el = document.createElement('u');
  else if (type === 'italic') el = document.createElement('em');
  else if (type === 'big') { el = document.createElement('span'); el.style.fontSize = '1.18em'; }
  else if (type === 'small') { el = document.createElement('span'); el.style.fontSize = '0.85em'; }
  else return document.createTextNode(innerText);
  // Stejně jako u richText() — vnitřek necháme projít přes richText(), aby se
  // i tady rozpoznaly případné další (vnořené) formátovací značky, ne jen
  // vložily jako obyčejný text.
  el.innerHTML = richText(innerText);
  return el;
}

// Naplní editor naformátovaným obsahem podle datového řetězce — stejná pravidla
// jako finální richText() pro export, jen se tu navíc nic z toho nezobrazuje jako
// syrový text (žádné **, __ apod. nejsou v DOM editoru vůbec přítomné).
function renderRichCE(ce, raw){
  ce.innerHTML = richText(raw);
}

// Převede aktuální DOM obsah editoru zpátky na datový řetězec se značkami —
// jediné místo, kde značky (**, __, ++, ~~, [ ](...)) vůbec vznikají.
// Přidá kus textu/značky do rozestavěného výstupu. Pokud by nová část
// začínající hvězdičkou navazovala přímo na hvězdičku už na konci výstupu
// (např. konec "**" hned následovaný začátkem "*"), vloží mezi ně neviditelný
// oddělovač (U+200B) — jinak by dvě sousední značky splynuly v nerozlišitelnou
// řadu hvězdiček a při zpětném čtení by se špatně spárovaly. Do zobrazeného
// textu to nijak nezasáhne (nulová šířka).
function appendRaw(state, s){
  if (s && s[0] === '*' && state.str.endsWith('*')) state.str += '\u200B';
  state.str += s;
}
function ceToRaw(node){
  const state = {str: ''};
  ceToRawInto(node, state);
  return state.str;
}
// Vlastní rekurze — na rozdíl od dřívější verze sdílí jeden `state` napříč
// celým voláním (i mezi vnořenými značkami), aby appendRaw() vždy viděl
// opravdu poslední zapsaný znak, včetně těch z vnořených dětí.
function ceToRawInto(node, state){
  node.childNodes.forEach(child => {
    if (child.nodeType === Node.TEXT_NODE){
      appendRaw(state, child.data);
    } else if (child.nodeType === Node.ELEMENT_NODE){
      const tag = child.tagName;
      if (tag === 'BR'){
        appendRaw(state, '\n');
      } else if (tag === 'STRONG' || tag === 'B'){
        // Pokud tučně obaluje jen a pouze kurzívu (nic jiného), zapíšeme rovnou
        // jednoznačným "***text***" místo vnořeného "**" + "*text*" + "**" —
        // ty by se jinak na hranici sloučily do nerozlišitelné řady hvězdiček.
        const only = child.childNodes.length === 1 ? child.firstChild : null;
        if (only && only.nodeType === Node.ELEMENT_NODE && (only.tagName === 'EM' || only.tagName === 'I')){
          appendRaw(state, '***'); ceToRawInto(only, state); appendRaw(state, '***');
        } else {
          appendRaw(state, '**'); ceToRawInto(child, state); appendRaw(state, '**');
        }
      } else if (tag === 'U'){
        appendRaw(state, '__'); ceToRawInto(child, state); appendRaw(state, '__');
      } else if (tag === 'EM' || tag === 'I'){
        const only = child.childNodes.length === 1 ? child.firstChild : null;
        if (only && only.nodeType === Node.ELEMENT_NODE && (only.tagName === 'STRONG' || only.tagName === 'B')){
          appendRaw(state, '***'); ceToRawInto(only, state); appendRaw(state, '***');
        } else {
          appendRaw(state, '*'); ceToRawInto(child, state); appendRaw(state, '*');
        }
      } else if (tag === 'A'){
        appendRaw(state, '[' + (child.textContent || '') + '](' + (child.getAttribute('href') || '') + ')');
      } else if (tag === 'SPAN' && child.style.fontSize === '1.18em'){
        appendRaw(state, '++'); ceToRawInto(child, state); appendRaw(state, '++');
      } else if (tag === 'SPAN' && child.style.fontSize === '0.85em'){
        appendRaw(state, '~~'); ceToRawInto(child, state); appendRaw(state, '~~');
      } else if (tag === 'DIV' || tag === 'P'){
        // Pro jistotu — kdyby prohlížeč přesto vytvořil blokový element,
        // bereme ho jako nový řádek (běžné psaní ho díky ošetření Enteru níž nevytváří).
        if (state.str && !state.str.endsWith('\n')) appendRaw(state, '\n');
        ceToRawInto(child, state);
      } else {
        ceToRawInto(child, state);
      }
    }
  });
}

// Vloží čistý text (bez formátování) na pozici kurzoru — použito pro vkládání
// ze schránky i pro Enter (řádkový zlom je pak jen znak "\n", ne nový blok).
function insertPlainTextAtCaret(ce, text){
  const sel = window.getSelection();
  let range;
  if (sel.rangeCount && ce.contains(sel.getRangeAt(0).commonAncestorContainer)){
    range = sel.getRangeAt(0);
  } else {
    range = document.createRange();
    range.selectNodeContents(ce);
    range.collapse(false);
  }
  range.deleteContents();
  const textNode = document.createTextNode(text);
  range.insertNode(textNode);
  range.setStartAfter(textNode);
  range.setEndAfter(textNode);
  sel.removeAllRanges();
  sel.addRange(range);
}

// Stejná pravidla jako tokenizeRichText — použito pro "živé" rozpoznání právě
// dokončené značky (viz tryAutoFormatAtCaret).
function richTextMatchRegex(){
  return new RegExp(richMarkupSource(), 'gu');
}

// Umožňuje formátování psát i ručně (**tučně**, *kurzíva*…), stejně jako dřív —
// jakmile uživatel dopíše přesně na místě kurzoru uzavírací značku, rovnou se
// tam promění ve skutečné formátování (marky samotné se nikdy nezobrazí).
function tryAutoFormatAtCaret(ce){
  const sel = window.getSelection();
  if (!sel.rangeCount) return false;
  const range = sel.getRangeAt(0);
  if (!range.collapsed) return false;
  const node = range.startContainer;
  if (node.nodeType !== Node.TEXT_NODE || !ce.contains(node)) return false;
  const text = node.data;
  const caret = range.startOffset;
  const re = richTextMatchRegex();
  let m, found = null;
  while ((m = re.exec(text))){
    if (m.index > caret) break;
    if (re.lastIndex === caret){ found = m; break; }
  }
  if (!found) return false;
  const beforeText = text.slice(0, found.index);
  const afterText = text.slice(caret);
  let repl;
  if (found[1] !== undefined){
    repl = document.createElement('a');
    repl.href = found[2];
    repl.textContent = found[1];
  } else if (found[3] !== undefined) repl = buildRichTag('boldital', found[3]);
  else if (found[4] !== undefined) repl = buildRichTag('bold', found[4]);
  else if (found[5] !== undefined) repl = buildRichTag('underline', found[5]);
  else if (found[6] !== undefined) repl = buildRichTag('big', found[6]);
  else if (found[7] !== undefined) repl = buildRichTag('small', found[7]);
  else if (found[8] !== undefined) repl = buildRichTag('italic', found[8]);
  else return false;
  const parent = node.parentNode;
  const frag = document.createDocumentFragment();
  if (beforeText) frag.appendChild(document.createTextNode(beforeText));
  frag.appendChild(repl);
  const afterNode = document.createTextNode(afterText);
  frag.appendChild(afterNode);
  parent.replaceChild(frag, node);
  const newRange = document.createRange();
  newRange.setStart(afterNode, 0);
  newRange.collapse(true);
  sel.removeAllRanges();
  sel.addRange(newRange);
  return true;
}

// Naváže veškeré chování editoru (psaní, vkládání ze schránky, Enter, úprava
// odkazu na dvojklik) — sdíleno mezi poli v panelu i velkým oknem modálu.
// onChange(rawString) se volá po každé smysluplné změně obsahu.
function wireRichCE(ce, onChange){
  const commit = () => onChange(ceToRaw(ce));
  ce.addEventListener('input', () => {
    tryAutoFormatAtCaret(ce);
    commit();
  });
  ce.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){
      e.preventDefault();
      insertPlainTextAtCaret(ce, '\n');
      commit();
    }
  });
  ce.addEventListener('paste', (e) => {
    e.preventDefault();
    const text = (e.clipboardData || window.clipboardData).getData('text/plain');
    insertPlainTextAtCaret(ce, text);
    commit();
  });
  // Odkaz v editoru slouží k úpravě textu, ne k navigaci — kliknutí ho jen posune kurzor.
  ce.addEventListener('click', (e) => { if (e.target.closest('a')) e.preventDefault(); });
  // Dvojklik na odkaz umožní přepsat jeho cílovou adresu.
  ce.addEventListener('dblclick', (e) => {
    const a = e.target.closest('a');
    if (!a) return;
    e.preventDefault();
    const url = prompt('Adresa odkazu:', a.getAttribute('href') || '');
    if (url !== null){ a.setAttribute('href', url); commit(); }
  });
}

// Propojí konkrétní panelové pole (skrytá <textarea> = zdroj dat pro zbytek appky)
// se skutečným WYSIWYG editorem (viditelný <div contenteditable>).
function attachRichtextCE(ta, ce){
  if (ta.placeholder) ce.dataset.placeholder = ta.placeholder;
  renderRichCE(ce, ta.value);
  wireRichCE(ce, (raw) => {
    if (ta.value !== raw){
      ta.value = raw;
      ta.dispatchEvent(new Event('input', {bubbles:true}));
    }
    if (raw === '' && ce.innerHTML !== '') ce.innerHTML = '';
  });
  // Když se hodnota textarey změní zvenčí (velké okno, načtení projektu…),
  // promítni to i do editoru — ale ne když v něm uživatel zrovna píše.
  ta.addEventListener('input', () => {
    if (document.activeElement === ce) return;
    renderRichCE(ce, ta.value);
  });
}

/* ---------- velké okno pro psaní delších textů + jednoduché formátování ---------- */
let expandModalTarget = null;
const FMT_BUTTONS = [
  {cls:'b', label:'B', title:T("Tučně","Bold"), type:'bold'},
  {cls:'i', label:'I', title:T("Kurzíva","Italic"), type:'italic'},
  {cls:'u', label:'U', title:T("Podtržení","Underline"), type:'underline'},
  {cls:'big', label:'A+', title:T("Větší text","Bigger text"), type:'big'},
  {cls:'small', label:'A-', title:T("Menší text","Smaller text"), type:'small'},
];
// Zjistí, jestli daný DOM element odpovídá formátovací značce daného typu
// (bold/underline/italic/big/small) — použito pro zvýraznění tlačítek i pro
// přepínání (zapnuto/vypnuto) při kliknutí.
function fmtTypeMatches(el, type){
  if (!el || el.nodeType !== 1) return false;
  const tag = el.tagName;
  if (type === 'bold') return tag === 'STRONG' || tag === 'B';
  if (type === 'underline') return tag === 'U';
  if (type === 'italic') return tag === 'EM' || tag === 'I';
  if (type === 'big') return tag === 'SPAN' && el.style.fontSize === '1.18em';
  if (type === 'small') return tag === 'SPAN' && el.style.fontSize === '0.85em';
  return false;
}
// Najde nejbližšího předka (až po hranici editoru ce), který odpovídá danému typu formátu.
function findFmtAncestor(node, ce, type){
  let n = node;
  while (n && n !== ce){
    if (fmtTypeMatches(n, type)) return n;
    n = n.parentNode;
  }
  return null;
}
// Podle aktuálního výběru/kurzoru v editoru zvýrazní (nebo odzvýrazní) tlačítka
// v jeho toolbaru — tlačítko svítí, pokud je kurzor uvnitř dané značky.
function updateFmtToolbarState(bar, ce){
  if (!bar) return;
  const sel = window.getSelection();
  let node = null;
  if (sel.rangeCount){
    const range = sel.getRangeAt(0);
    if (ce.contains(range.commonAncestorContainer)) node = range.commonAncestorContainer;
  }
  bar.querySelectorAll('.fmt-btn').forEach(btn => {
    const type = btn.dataset.fmtType;
    const active = node ? !!findFmtAncestor(node, ce, type) : false;
    btn.classList.toggle('active', active);
  });
}
// Obalí vybraný text ve WYSIWYG editoru skutečným formátovacím elementem
// (nebo ho vloží, pokud nic není vybráno) a vyvolá 'input', aby se rovnou
// promítlo do stavu i náhledu. Pokud je výběr/kurzor už uvnitř značky stejného
// typu, značku naopak odstraní — tlačítko tak funguje jako přepínač zapnuto/vypnuto.
function wrapSelectionCE(ce, type){
  ce.focus();
  const sel = window.getSelection();
  let range;
  if (sel.rangeCount && ce.contains(sel.getRangeAt(0).commonAncestorContainer)){
    range = sel.getRangeAt(0);
  } else {
    range = document.createRange();
    range.selectNodeContents(ce);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  }
  const existing = findFmtAncestor(range.commonAncestorContainer, ce, type);
  if (existing){
    const parent = existing.parentNode;
    const children = Array.from(existing.childNodes);
    children.forEach(child => parent.insertBefore(child, existing));
    parent.removeChild(existing);
    if (children.length){
      const newRange = document.createRange();
      newRange.setStartBefore(children[0]);
      newRange.setEndAfter(children[children.length - 1]);
      sel.removeAllRanges();
      sel.addRange(newRange);
    }
    parent.normalize();
    ce.dispatchEvent(new Event('input', {bubbles:true}));
    return;
  }
  const content = range.toString() || 'text';
  const el = buildRichTag(type, content);
  range.deleteContents();
  range.insertNode(el);
  const newRange = document.createRange();
  newRange.selectNodeContents(el);
  sel.removeAllRanges();
  sel.addRange(newRange);
  ce.dispatchEvent(new Event('input', {bubbles:true}));
}
function appendFmtButtons(container, targetGetter){
  FMT_BUTTONS.forEach(b => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'fmt-btn ' + b.cls;
    btn.title = b.title;
    btn.textContent = b.label;
    btn.dataset.fmtType = b.type;
    btn.addEventListener('click', () => {
      const ce = targetGetter();
      wrapSelectionCE(ce, b.type);
      updateFmtToolbarState(container, ce);
    });
    container.appendChild(btn);
  });
  // Sleduje pohyb kurzoru/výběru v editoru a podle toho tlačítka zvýrazňuje.
  const ce = targetGetter();
  if (ce){
    const refresh = () => updateFmtToolbarState(container, targetGetter());
    ce.addEventListener('keyup', refresh);
    ce.addEventListener('mouseup', refresh);
    ce.addEventListener('focus', refresh);
    ce.addEventListener('blur', () => {
      container.querySelectorAll('.fmt-btn').forEach(btn => btn.classList.remove('active'));
    });
  }
}

function enhanceTextareas(){
  document.querySelectorAll('#panel textarea:not([data-expand-bound])').forEach(ta => {
    ta.setAttribute('data-expand-bound','1');
    // Popisek pole si musíme zapamatovat ještě PŘED přesunem do wrapperu —
    // jakmile má pole formátovací lištu (.fmt-toolbar), ta se vloží MEZI
    // <label> a textarea, takže "poslední sourozenec před polem" by pak
    // ukazoval na lištu, ne na popisek (viz openTextareaModal níže).
    const originalLabel = ta.previousElementSibling;
    if (originalLabel && originalLabel.tagName === 'LABEL') {
      ta.dataset.fieldLabel = originalLabel.textContent;
    }
    const wrap = document.createElement('div');
    wrap.className = 'textarea-wrap';
    ta.parentNode.insertBefore(wrap, ta);
    if (ta.dataset.richtext === '1') {
      const bar = document.createElement('div');
      bar.className = 'fmt-toolbar';
      wrap.parentNode.insertBefore(bar, wrap);
      // Textarea zůstává v DOM jen jako datový zdroj (napojený na zbytek appky
      // přes .value a 'input' události) — samotné psaní teď probíhá ve
      // skutečném formátovaném poli níž, textarea se uživateli nikdy nezobrazí.
      ta.style.display = 'none';
      wrap.appendChild(ta);
      const ce = document.createElement('div');
      ce.className = 'rt-ce';
      ce.setAttribute('contenteditable', 'true');
      ce.spellcheck = true;
      wrap.appendChild(ce);
      appendFmtButtons(bar, () => ce);
      attachRichtextCE(ta, ce);
    } else {
      wrap.appendChild(ta);
    }
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'textarea-expand-btn';
    btn.title = T("Psát ve větším okně","Write in a larger window");
    btn.textContent = '⤢';
    wrap.appendChild(btn);
    btn.addEventListener('click', () => openTextareaModal(ta));
  });
}

/* ---------- celá obrazovka / focus mode ---------- */
// Jedno tlačítko dělá dvě věci najednou: zkusí přepnout prohlížeč do
// opravdové celoobrazovkové režimu (Fullscreen API) a zároveň přepne
// rozhraní do "focus" režimu s větším prostorem pro editor a náhled.
// Pokud Fullscreen API selže nebo není podporované (např. je to
// zakázané v iframe), focus režim se přesto zapne — jen bez skutečného
// přepnutí na celou obrazovku prohlížeče.
function updateFullscreenBtnUi(active){
  document.body.classList.toggle('focus-mode', active);
  const btn = document.getElementById('fullscreenBtn');
  if (!btn) return;
  btn.classList.toggle('active', active);
  btn.innerHTML = active
    ? T("⛶ <span class=\"btn-label\">Ukončit celou obrazovku</span>","⛶ <span class=\"btn-label\">Exit fullscreen</span>")
    : T("⛶ <span class=\"btn-label\">Celá obrazovka</span>","⛶ <span class=\"btn-label\">Fullscreen</span>");
  btn.title = active ? T("Ukončit režim celé obrazovky","Exit fullscreen mode") : T("Přepnout na celou obrazovku (schová horní lišty)","Switch to fullscreen (hides the top bars)");
}
function toggleAppFullscreen(){
  const turningOn = !document.body.classList.contains('focus-mode');
  if (turningOn) {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (req) { try { req.call(el).catch(() => {}); } catch (err) {} }
  } else if (document.fullscreenElement || document.webkitFullscreenElement) {
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (exit) { try { exit.call(document).catch(() => {}); } catch (err) {} }
  }
  updateFullscreenBtnUi(turningOn);
}
document.getElementById('fullscreenBtn').addEventListener('click', toggleAppFullscreen);
// Prohlížeč umí celou obrazovku ukončit i mimo naše tlačítko (klávesa Esc) —
// tohle drží stav tlačítka a schované lišty synchronizované i v tom případě.
document.addEventListener('fullscreenchange', () => updateFullscreenBtnUi(!!document.fullscreenElement));
document.addEventListener('webkitfullscreenchange', () => updateFullscreenBtnUi(!!document.webkitFullscreenElement));

// se tím nemají resetovat — stav se drží tady mezi jednotlivými voláními.
const collapsedFieldsets = new Set();
let fieldsetsInitialized = false;

function initCollapsibleFieldsets(){
  const fieldsets = panel.querySelectorAll(':scope > .fieldset');
  fieldsets.forEach((fs, idx) => {
    const title = fs.querySelector('.fieldset-title');
    if (!title) return; // poslední fieldset (závěrečná poznámka) titulek nemá
    const key = title.textContent.trim() || (T("sekce-","section-") + idx);
    const bodyWrap = document.createElement('div');
    bodyWrap.className = 'fieldset-body-wrap';
    const body = document.createElement('div');
    body.className = 'fieldset-body';
    bodyWrap.appendChild(body);
    while (title.nextSibling) body.appendChild(title.nextSibling);
    fs.appendChild(bodyWrap);
    title.classList.add('fieldset-toggle');
    title.setAttribute('role', 'button');
    title.setAttribute('tabindex', '0');
    // při úplně prvním vykreslení nech otevřenou jen první sekci, zbytek sbal
    if (!fieldsetsInitialized && idx > 0) collapsedFieldsets.add(key);
    const isCollapsed = collapsedFieldsets.has(key);
    fs.classList.toggle('collapsed', isCollapsed);
    title.setAttribute('aria-expanded', isCollapsed ? 'false' : 'true');
    const toggle = () => {
      const nowCollapsed = fs.classList.toggle('collapsed');
      title.setAttribute('aria-expanded', nowCollapsed ? 'false' : 'true');
      if (nowCollapsed) collapsedFieldsets.add(key); else collapsedFieldsets.delete(key);
    };
    title.addEventListener('click', toggle);
    title.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
  });
  fieldsetsInitialized = true;
}

${T("          <div class=\"note-box\" style=\"margin-top:8px;\">Podporované jsou odkazy na YouTube a Vimeo — automaticky se převedou na vložené (embed) video. Jiné odkazy se zkusí vložit tak, jak jsou (musí to už být přímo embed adresa).</div>","          <div class=\"note-box\" style=\"margin-top:8px;\">YouTube and Vimeo links are supported — they're converted to an embedded video automatically. Other links are used as-is (must already be a direct embed URL).</div>")}

// Zmenší nahraný obrázek na rozumnou maximální velikost, ať appka
// v localStorage neukládá klidně několikamegabajtovou fotku z mobilu —
// pro výřez do čtvercových ikon i OG obrázku bohatě stačí max. 1400 px.
function resizeImageDataUrl(dataUrl, maxDim){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * scale);
      const h = Math.round(img.naturalHeight * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

// Vykreslí čtvercový výřez zdrojového obrázku podle aktuální pozice/přiblížení
// (stejná logika jako CSS náhled: background-position v % + zoom) do canvasu
// o hraně "size" pixelů.
function cropSquareCanvas(img, size, xPercent, yPercent, zoomPercent){
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  const coverScale = Math.max(size / img.naturalWidth, size / img.naturalHeight);
  const scale = coverScale * (zoomPercent / 100);
  const drawW = img.naturalWidth * scale;
  const drawH = img.naturalHeight * scale;
  const offsetX = (size - drawW) * (xPercent / 100);
  const offsetY = (size - drawH) * (yPercent / 100);
  ctx.drawImage(img, offsetX, offsetY, drawW, drawH);
  return canvas;
}

// Zmenší už oříznutý čtvercový canvas na menší cílovou velikost (kvalitněji
// než opakované ořezávání ze zdrojového obrázku pro každou velikost zvlášť).
function resizeCanvasTo(sourceCanvas, size){
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(sourceCanvas, 0, 0, size, size);
  return canvas;
}

function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Sdílecí obrázek pro sociální sítě (OG, 1200×630) — vygenerovaný z barev
// webu (stejný přechod jako pozadí stránky) + vycentrovaná ikona + název webu.
// Není to editovatelný design, jen rozumný výchozí obrázek, ať uživatel
// nemusí nic dalšího nahrávat.
function generateOgImageCanvas(iconCanvas, s){
  const w = 1200, h = 630;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, s.bg1 || '#1a1a1a');
  grad.addColorStop(1, s.bg2 || '#000000');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
  const iconSize = 360;
  const iconX = (w - iconSize) / 2;
  const iconY = 76;
  ctx.save();
  roundRectPath(ctx, iconX, iconY, iconSize, iconSize, 48);
  ctx.clip();
  ctx.drawImage(iconCanvas, iconX, iconY, iconSize, iconSize);
  ctx.restore();
  const brand = (s.brand || '').trim();
  if (brand){
    ctx.fillStyle = '#ffffff';
    ctx.font = "700 56px 'Space Grotesk', sans-serif";
    ctx.textAlign = 'center';
    ctx.fillText(brand, w / 2, iconY + iconSize + 88, w - 120);
  }
  return canvas;
}

// Z aktuálního výřezu (state.iconsCrop) vygeneruje favicon, apple-touch-icon,
// obě PWA ikony (192/512) i OG obrázek a uloží je do state jako base64 PNG.
async function regenerateIconsFromCrop(){
  if (!state.icons.source) return;
  const img = new Image();
  await new Promise((resolve, reject) => {
    img.onload = resolve;
    img.onerror = reject;
    img.src = state.icons.source;
  });
  const { x, y, zoom } = state.iconsCrop;
  const master = cropSquareCanvas(img, 512, x, y, zoom);
  state.icons.icon512 = master.toDataURL('image/png');
  state.icons.icon192 = resizeCanvasTo(master, 192).toDataURL('image/png');
  state.icons.appleTouchIcon = resizeCanvasTo(master, 180).toDataURL('image/png');
  state.favicon = resizeCanvasTo(master, 64).toDataURL('image/png');
  state.icons.ogImage = generateOgImageCanvas(master, state).toDataURL('image/png');
  renderForm();
  updatePreview();
}

function bindIconCropperInputs(){
  const fileInput = document.getElementById('iconSourceFile');
  if (fileInput){
    fileInput.addEventListener('change', () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        state.icons.source = await resizeImageDataUrl(reader.result, 1400);
        state.iconsCrop = { x: 50, y: 50, zoom: 100 };
        await regenerateIconsFromCrop();
      };
      reader.readAsDataURL(file);
    });
  }
  const viewport = document.getElementById('iconCropViewport');
  const preview = document.getElementById('iconCropPreview');
  const zoomRange = document.getElementById('iconZoomRange');
  const xRange = document.getElementById('iconPosXRange');
  const yRange = document.getElementById('iconPosYRange');
  if (viewport && preview && zoomRange && xRange && yRange){
    // Posuvníky jen přepočítají živý CSS náhled (levné, plynulé) — skutečné
    // vygenerování ostrých PNG souborů proběhne až po kliknutí na tlačítko.
    const updateLivePreview = () => {
      state.iconsCrop.zoom = Number(zoomRange.value);
      state.iconsCrop.x = Number(xRange.value);
      state.iconsCrop.y = Number(yRange.value);
      preview.style.transform = `scale(${(state.iconsCrop.zoom / 100).toFixed(2)})`;
      preview.style.backgroundPosition = `${state.iconsCrop.x}% ${state.iconsCrop.y}%`;
    };
    zoomRange.addEventListener('input', updateLivePreview);
    xRange.addEventListener('input', updateLivePreview);
    yRange.addEventListener('input', updateLivePreview);
  }
  const applyBtn = document.getElementById('applyIconCrop');
  if (applyBtn){
    applyBtn.addEventListener('click', () => {
      applyBtn.disabled = true;
      applyBtn.textContent = T("⏳ Generuji…","⏳ Generating…");
      regenerateIconsFromCrop().finally(() => {
        applyBtn.disabled = false;
        applyBtn.textContent = T("✓ Použít výřez a vygenerovat ikony","✓ Apply crop and generate icons");
      });
    });
  }
}

  el.querySelectorAll('[data-section-image-file]').forEach(fileInput => {

      const reader = new FileReader();
      reader.onload = () => {
        state.sections[i].image = reader.result;
        renderSections();
        updatePreview();
      };
      reader.readAsDataURL(file);
    });
  });
  el.querySelectorAll('[data-remove-section-image]').forEach(btn => {
    btn.onclick = () => {
      const i = +btn.dataset.removeSectionImage;
      state.sections[i].image = '';
      state.sections[i].imageUrl = '';
      state.sections[i].imageAlt = '';
      renderSections();
      updatePreview();

  el.querySelectorAll('[data-remove-section]').forEach(btn => {
    btn.onclick = () => {
      const removedIndex = +btn.dataset.removeSection;
      state.sections.splice(removedIndex,1);
      if (previewSectionIndex === removedIndex) previewSectionIndex = null;
      else if (previewSectionIndex != null && previewSectionIndex > removedIndex) previewSectionIndex--;
      updatePreviewIndicator();
      // Tlačítka, která odkazovala na smazanou (nebo teď neplatnou) stránku, přesměruj zpět na Funkce.
      state.ctaButtons.forEach(cb => {
        if(cb.targetType === 'section' && (cb.sectionIndex == null || cb.sectionIndex >= state.sections.length)){
          cb.targetType = 'features'; cb.sectionIndex = null;
        }
      });
      state.cards.forEach(c => {
        if(c.linkType === 'section' && (c.sectionIndex == null || c.sectionIndex >= state.sections.length)){
          c.linkType = 'none'; c.sectionIndex = null;
        }
      });
      renderSections(); renderCtaList(); renderCards(); updatePreview();
    };
  });

  state.sections.forEach((sec,i) => {
    if ((sec.type||'simple') !== 'landing') return;
    const box = document.getElementById('sectionCards-'+i);
    if (!box) return;
    box.innerHTML = sec.landingCards.map((c,j) => `

        </div>
        <textarea data-section-card="${i}:${j}" data-key="text" data-richtext="1" style="margin-top:6px;min-height:40px;">${escapeHtml(c.text)}</textarea>

    box.querySelectorAll('[data-section-card]').forEach(inp => {
      inp.addEventListener('input', () => {
        const [ii,jj] = inp.dataset.sectionCard.split(':').map(Number);
        state.sections[ii].landingCards[jj][inp.dataset.key] = inp.value;
        updatePreview();

    box.querySelectorAll('[data-remove-section-card]').forEach(btn => {

        state.sections[ii].landingCards.splice(jj,1);
        renderSections();
        updatePreview();
      };
    });
  });
  enhanceTextareas();
}

/* ============================================================
   GENEROVÁNÍ manifest.json / sw.js / sitemap.xml
   ============================================================ */
function slugifyGlobal(str, fallback){
  const out = String(str ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  return out || fallback || 'web';
}

function buildManifestJSON(s){
  const name = (s.pwa.name || s.brand || 'App').trim();
  const shortName = (s.pwa.shortName || s.brand || name).trim();
  const bg = (s.pwa.bgColor || s.bg2 || '#000000').trim();
  const manifest = {
    id: s.pwa.startUrl || './',
    name: name,
    short_name: shortName,
    description: s.description,
    start_url: s.pwa.startUrl || './',
    scope: s.pwa.scope || './',
    display: s.pwa.display || 'standalone',
    background_color: bg,
    theme_color: s.accent,
    lang: 'cs',
    icons: [
      { src: s.pwa.icon192 || 'icon-192.png', sizes: '192x192', type: 'image/png' },
      { src: s.pwa.icon512 || 'icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
    ]
  };
  return JSON.stringify(manifest, null, 2);
}

function buildServiceWorkerJS(s){
  const slug = slugifyGlobal(s.brand, 'web');
  const version = (s.pwa.cacheVersion || 'v1').trim().replace(/\s+/g,'-');
  const cacheName = `${slug}-app-${version}`;

  // Hlavní stránka se stahuje pod názvem odvozeným ze značky (např.
  // "mojefirma.html"), ne pod "index.html" — a jestli si ji na hostingu
  // přejmenuješ, nebo necháš pod původním názvem, je čistě na tobě (viz
  // poznámka u tlačítek). Aby cache i offline záloha fungovaly v OBOU
  // případech automaticky, přidáváme do seznamu rovnou obě varianty názvu
  // (a jako poslední záchranu i samotné "./") — ta neexistující jen tiše
  // neuspěje při instalaci, nic to nerozbije.
  const homeFilename = getHomeFilename(s);
  const homeCandidates = ['./', './index.html', `./${homeFilename}`];

  // Manifest, favicon, apple-touch-icon a obě PWA ikony (192×192/512×512)
  // se do cache doplňují automaticky podle aktuálních polí výše — nemusíš
  // je ručně opisovat do pole "Další soubory pro offline cache" a hlídat,
  // že spolu sedí, i když si názvy ikon přejmenuješ.
  const autoFiles = [
    'manifest.json',
    'favicon.ico',
    'apple-touch-icon.png',
    (s.pwa.icon192 || 'icon-192.png').trim(),
    (s.pwa.icon512 || 'icon-512.png').trim()
  ];

  const extra = (s.pwa.extraFiles || '')
    .split('\n').map(l => l.trim()).filter(Boolean);
  const files = Array.from(new Set([...homeCandidates, ...autoFiles, ...extra]));
  const filesJs = files.map(f => `  '${f.replace(/'/g, "\\'")}'`).join(',\n');

  return `// ==========================================
// Service worker — ${s.brand}
// Vygenerováno Layout generátorem.
// DŮLEŽITÉ: při KAŽDÉ nové verzi webu zvyš hodnotu pole "Verze cache"
// v generátoru (a znovu stáhni sw.js) - jinak si prohlížeč může držet
// starou zacachovanou verzi appky i po nahrání nového obsahu na server.
// ==========================================

const CACHE_NAME = '${cacheName}';

// Soubory app shellu cachované při instalaci (a použité jako offline záloha).
// Hlavní stránka je v seznamu pod oběma možnými názvy ("${homeFilename}" i
// "index.html"), takže to funguje, ať už si ji na hostingu přejmenuješ,
// nebo ne — ten neexistující název jen tiše neuspěje, instalaci to nezastaví.
const ASSETS_TO_CACHE = [
${filesJs}
];

self.addEventListener('install', (event) => {
  event.waitUntil(
    caches.open(CACHE_NAME).then((cache) => {
      // Soubory přidáváme jednotlivě - když se jeden nepodaří stáhnout
      // (404, překlep v názvu...), instalace kvůli tomu neselže jako celek.
      return Promise.all(
        ASSETS_TO_CACHE.map((url) =>
          cache.add(url).catch((err) => {
${T("            console.log('[SW] Nepodařilo se zacachovat:', url, err);","            console.log('[SW] Failed to cache:', url, err);")}
          })
        )
      );
    })
  );
  self.skipWaiting();
});

self.addEventListener('activate', (event) => {
  event.waitUntil(
    caches.keys().then((cacheNames) =>
      Promise.all(
        cacheNames.map((name) => {
          if (name !== CACHE_NAME) {
            console.log('[SW] Deleting old cache:', name);
            return caches.delete(name);
          }
        })
      )
    )
  );
  self.clients.claim();
});

// Network-first: vždy se nejdřív zkusí čerstvá verze ze sítě, cache
// slouží jen jako offline záloha, když uživatel nemá připojení.
self.addEventListener('fetch', (event) => {
  if (event.request.method !== 'GET') return;

  event.respondWith(
    (async () => {
      const cache = await caches.open(CACHE_NAME);
      try {
        const networkResponse = await fetch(event.request, { cache: 'no-cache' });
        if (networkResponse && networkResponse.ok) {
          cache.put(event.request, networkResponse.clone()).catch(() => {});
        }
        return networkResponse;
      } catch (err) {
        const cached = await cache.match(event.request);
        if (cached) return cached;
        // Poslední záloha pro navigaci (otevření appky offline) — projde
        // postupně obě možné varianty názvu hlavní stránky i "./", ať už
        // je appka na hostingu pod původním názvem, nebo přejmenovaná.
        if (event.request.mode === 'navigate') {
          const homeCandidates = [${homeCandidates.map(c => `'${c}'`).join(', ')}];
          for (const url of homeCandidates) {
            const fallback = await cache.match(url);
            if (fallback) return fallback;
          }
        }
        throw err;
      }
    })()
  );
});
`;
}

function buildSitemapXML(s){
  const domain = (s.domain || 'https://example.com/').trim().replace(/\/?$/, '/');
  const lastmod = (s.sitemap.lastmod || new Date().toISOString().slice(0,10)).trim();
  const extra = (s.sitemap.extraUrls || '')
    .split('\n').map(l => l.trim()).filter(Boolean)
    .map(l => /^https?:\/\//i.test(l) ? l : domain + l.replace(/^\//,''));
  // Vlastní stránky (samostatné .html soubory) se do sitemapy přidají automaticky.
  const pageUrls = computeCustomSectionsData(s).map(sec => domain + sec.filename);
  // Stránka GDPR (na rozdíl od 404) má smysl nechat indexovat.
  const privacyUrl = (s.privacyPage && s.privacyPage.enabled) ? [domain + 'privacy.html'] : [];
  const urls = Array.from(new Set([domain, ...pageUrls, ...privacyUrl, ...extra]));
  const urlEntries = urls.map(u => `  <url>
    <loc>${escapeHtml(u)}</loc>
    <lastmod>${escapeHtml(lastmod)}</lastmod>
  </url>`).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
${urlEntries}
</urlset>
`;
}

function buildRobotsTXT(s){
  const domain = (s.domain || 'https://example.com/').trim().replace(/\/?$/, '/');
  return `User-agent: *
Allow: /

Sitemap: ${domain}sitemap.xml
`;
}

function downloadTextFile(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ============================================================
   GENEROVÁNÍ VÝSLEDNÉHO STATICKÉHO HTML
   ============================================================ */
function slugifyPage(str, fallback){
  const out = String(str ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
  return out || fallback;
}

function getHomeFilename(s){
  const slug = (s.brand || 'web').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') || 'web';
  return slug + '.html';
}

// Spočítá pro každou vlastní stránku unikátní slug + název souboru — používá to
// jak hlavní stránka (kvůli menu a odkazům), tak generátor jednotlivých souborů,
// aby si názvy vždy odpovídaly.
function computeCustomSectionsData(s){
  const used = new Set();
  return (s.sections || []).map((sec, i) => {
    const base = slugifyPage(sec.label || sec.title, 'stranka-' + (i+1));
    let slug = base, n = 2;
    while (used.has(slug)) { slug = base + '-' + n; n++; }
    used.add(slug);
    return { ...sec, type: sec.type || 'simple', id: 'sec-' + slug, slug, filename: slug + '.html' };
  });
}

// Pořadí položek levého menu: Hero -> Funkce -> vlastní stránky (pokud jsou zapnuté) -> FAQ.
// ctx.isHome = generujeme hlavní stránku (kotvy #hero/#funkce/#faq fungují lokálně),
// jinak jde o vlastní podstránku a stejné odkazy musí mířit zpátky na hlavní soubor.
function buildNavLinksData(s, customSectionsData, ctx){
  const links = [];
  if (s.nav?.showHero !== false) {
    links.push({ href: ctx.isHome ? '#hero' : ctx.homeFilename, label: s.nav?.heroLabel || T("Domů","Home"), local: ctx.isHome, id: 'home' });
  }
  if (s.nav?.showFeatures !== false && s.cards.length) {
    links.push({ href: ctx.isHome ? '#funkce' : (ctx.homeFilename + '#funkce'), label: s.nav?.featuresLabel || T("Funkce","Features"), local: ctx.isHome, id: 'home' });
  }
  if (s.nav?.showPagesMenu !== false) {
    customSectionsData.forEach(sec => links.push({ href: sec.filename, label: sec.label || sec.title, local: false, id: sec.slug }));
  }
  if (s.nav?.showFaq !== false && s.faq.length) {
    links.push({ href: ctx.isHome ? '#faq' : (ctx.homeFilename + '#faq'), label: s.nav?.faqLabel || 'FAQ', local: ctx.isHome, id: 'home' });
  }
  return links;
}

// Vykreslí sdílené postranní menu — na hlavní stránce se aktivní položka řeší za běhu
// (scroll/klik), na vlastní podstránce už víme dopředu, která položka je aktivní.

    const attrs = parts.length ? ' ' + parts.join(' ') : '';
    return `  <a href="${escapeAttr(l.href)}"${attrs}>${escapeHtml(l.label)}</a>`;
  }).join('\n');
  const socialLinks = (s.nav?.socialLinks || []).filter(l => (l.url || '').trim());
  const socialHtml = socialLinks.length ? `
  <div class="side-nav-social">
${socialLinks.map(l => {
    const [, label, icon] = socialPlatformMeta(l.platform);
    return `    <a href="${escapeAttr(l.url)}" target="_blank" rel="noopener" title="${escapeAttr(label)}" aria-label="${escapeAttr(label)}">${icon}</a>`;
  }).join('\n')}

  return `${T("  <button class=\"menu-toggle\" id=\"menuToggle\" aria-label=\"Otevřít menu\" aria-expanded=\"false\">","  <button class=\"menu-toggle\" id=\"menuToggle\" aria-label=\"Open menu\" aria-expanded=\"false\">")}

${T("  <nav class=\"side-nav\" id=\"sideNav\" aria-label=\"Hlavní navigace\">","  <nav class=\"side-nav\" id=\"sideNav\" aria-label=\"Main navigation\">")}
    <a href="${escapeAttr(brandHref)}" class="side-nav-brand" id="sideNavBrand"${brandAttrs}>${escapeHtml(s.brand)}</a>

// Jednoduchý cookie/GDPR banner dole na stránce — zobrazí se jen dokud
